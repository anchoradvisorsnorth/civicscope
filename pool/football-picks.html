<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Football Pool — Your Picks</title>
<style>
  :root{--navy:#0a2240;--green:#14532d;--gold:#c8a24b;--line:#e4e7ec;--muted:#667085;--bg:#f4f6f9;--card:#fff;--red:#b42318}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:#101828}
  header{background:linear-gradient(135deg,var(--navy),var(--green));color:#fff;padding:16px 18px}
  .wrap{max-width:640px;margin:0 auto}
  h1{margin:0;font-size:20px}
  h1 .sub{display:block;font-size:12px;font-weight:400;color:#b9c6da;margin-top:3px}
  main{max-width:640px;margin:0 auto;padding:16px 14px 120px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
  select,input{padding:10px 12px;border:1px solid var(--line);border-radius:8px;font-size:15px}
  .btn{border:none;border-radius:10px;padding:12px 22px;font-size:15px;font-weight:700;cursor:pointer}
  .btn.gold{background:var(--gold);color:#1a1300}
  .btn.gray{background:#eef2f7;color:var(--navy)}
  .btn:disabled{opacity:.5;cursor:default}
  .game{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden}
  .ghead{display:flex;justify-content:space-between;padding:8px 14px;font-size:12px;color:var(--muted);border-bottom:1px solid #f0f2f5}
  .sides{display:grid;grid-template-columns:1fr 1fr}
  .side{padding:14px 10px;text-align:center;cursor:pointer;border:none;background:#fff;font-size:15px;font-weight:700;color:#101828}
  .side:first-child{border-right:1px solid #f0f2f5}
  .side .lab{display:block;font-size:11px;color:var(--muted);font-weight:600;margin-top:3px}
  .side.on{background:var(--green);color:#fff}
  .side.on .lab{color:#bbf7d0}
  .bar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);padding:12px 14px;display:flex;gap:10px;justify-content:center;align-items:center;box-shadow:0 -4px 16px rgba(16,24,40,.08)}
  .prog{font-size:13px;font-weight:700;color:var(--muted)}
  .msg{position:fixed;bottom:78px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;border-radius:10px;padding:10px 18px;font-size:14px;display:none;z-index:5}
  .note{background:#fffaf0;border:1px solid #e7c84b;border-radius:10px;padding:10px 14px;font-size:13px;margin-bottom:12px}
  /* DEADLINE BANNER (Keith 2026-08-09: "the picks page should clearly stipulate that picks are due
     by a given time"). The close time was only in 12px grey subhead text in the header — the one
     fact that decides whether your card counts, rendered smaller than the game rows. */
  .dl{border-radius:12px;padding:12px 16px;margin-bottom:12px;border:1px solid;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
  .dl .k{font-size:11px;text-transform:uppercase;letter-spacing:.06em;font-weight:800;opacity:.75}
  .dl .v{font-size:17px;font-weight:800;margin-top:2px}
  .dl .cd{font-size:13px;font-weight:700;white-space:nowrap}
  .dl.ok{background:#f0f6ff;border-color:#b8d4ff;color:#0a2240}
  .dl.soon{background:#fff7ed;border-color:#fdba74;color:#7c2d12}
  .dl.shut{background:#fef3f2;border-color:#fda29b;color:#7a271a}
</style>
</head>
<body>
<div style="background:#08192e;font-family:-apple-system,'Segoe UI',Arial,sans-serif;font-size:13px;padding:8px 18px;display:flex;gap:18px;align-items:center"><a href="/pool" style="color:#fff;font-weight:800;text-decoration:none">🏆 The Pool</a><a href="/pool/golf" style="color:#b9c6da;text-decoration:none">Golf</a><a href="/pool/football" style="color:#b9c6da;text-decoration:none">Football</a><a href="/pool/live" style="color:#c8a24b;font-weight:700;text-decoration:none">Live</a></div>
<header><div class="wrap">
  <h1>🏈 Football Pool — Your Picks<span class="sub" id="sub">Winners against the spread · lock before first kickoff</span></h1>
</div></header>
<main>
  <div class="card" id="login">
    <div style="font-weight:700;margin-bottom:10px">Who are you?</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <select id="who"><option>Loading…</option></select>
      <input id="pin" inputmode="numeric" placeholder="PIN" style="width:90px">
      <button class="btn gold" onclick="enter()">Enter</button>
    </div>
    <div style="font-size:12px;color:#667085;margin-top:8px">Your PIN arrives by text when you join, and in the slate-lock email.
      <a href="#" onclick="changePinStandalone();return false" style="color:#0a2240;font-weight:700">Change your PIN</a></div>
  </div>
  <!-- Signed-in strip. The login card is a QUESTION ("who are you?"); once it is answered the
       question must go away and be replaced by its answer. Leaving the PIN box on screen after a
       successful sign-in is what made this page unreadable on a phone (Keith, 2026-08-08). -->
  <div class="card" id="whoami" style="display:none;align-items:center;gap:10px;flex-wrap:wrap">
    <div style="flex:1;min-width:150px">
      <div style="font-size:12px;color:#667085">Signed in as</div>
      <div style="font-weight:800;font-size:17px" id="whoamiName"></div>
    </div>
    <button class="btn gray" onclick="changePin()">Change PIN</button>
    <button class="btn gray" onclick="signOut()">Not you?</button>
  </div>
  <div id="content"></div>
</main>
<div class="msg" id="msg"></div>
<div class="bar" id="bar" style="display:none">
  <!-- TWO WAYS TO SUBMIT (Keith 2026-08-09): "player picks can be one step or the other — save,
       meaning they can edit before the deadline, or save and lock in one swoop, in which case they
       cannot." So Save is reversible and Lock is FINAL — there is no unlock button any more, on
       this page or on the server. -->
  <span class="prog" id="prog"></span><button class="btn gray" onclick="changePin()" title="Change your own PIN">PIN</button>
  <button class="btn gray" id="savebtn" onclick="save(false)">💾 Save</button>
  <button class="btn gold" id="lockbtn" onclick="save(true)">🔒 Save &amp; lock</button>
</div>

<script>
const API='/api/football-pool';
let me=null,pin=null,myId=null,week=null,slugName=null,picks={},lockedMine=false;
const esc=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function toast(t,ms){const m=document.getElementById('msg');m.textContent=t;m.style.display='block';clearTimeout(m._t);m._t=setTimeout(()=>m.style.display='none',ms||3000);}

async function boot(){
  const j=await(await fetch(API+'?players=1',{cache:'no-store'})).json();
  document.getElementById('who').innerHTML=(j.players||[]).map(p=>'<option>'+esc(p.name)+'</option>').join('')||'<option>No players set</option>';
  const saved=JSON.parse(sessionStorage.getItem('fb_me')||'null');
  if(saved){document.getElementById('who').value=saved.name;document.getElementById('pin').value=saved.pin;enter();}
}
let weekRows=[];
async function currentWeek(){
  const season=new Date().getFullYear();
  let rows=await(await fetch(API+'?list='+season,{cache:'no-store'})).json();
  if(!rows.length&&new Date().getMonth()<2) rows=await(await fetch(API+'?list='+(season-1),{cache:'no-store'})).json();
  weekRows=rows||[];                                   // kept so the empty state can say WHY
  const live=rows.filter(w=>w.slateLocked&&!w.finalized&&(!w.deadline||Date.now()<Date.parse(w.deadline)));
  return live.length?live[live.length-1].slug:null;
}
/* "No open slate" was the wrong words for every case it covered (Keith 2026-08-09, after following
   a link straight into it). It is jargon, it sounds like a fault, and it says nothing about which
   of three completely different situations you are in: the commissioner is still building the
   week · he built it but has not locked it · the week locked and the deadline has already passed.
   Say which one, and say what happens next. */
function noSlateMessage(){
  const drafts=weekRows.filter(w=>!w.slateLocked&&!w.finalized);
  const closed=weekRows.filter(w=>w.slateLocked&&!w.finalized&&w.deadline&&Date.now()>=Date.parse(w.deadline));
  if(closed.length){
    const w=closed[closed.length-1];
    return {sub:'Picks are closed for '+(w.label||w.slug),
      html:'<div class="dl shut"><div><div class="k">Picks are closed</div><div class="v">'+esc(w.label||w.slug)+'</div></div>'
        +'<div class="cd">'+new Date(w.deadline).toLocaleString('en-US',{timeZone:'America/New_York',weekday:'short',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})+' ET</div></div>'
        +'<div class="note">The first game has kicked off, so this week\'s card is final. Follow it live on the <a href="/pool/football">pool board</a>.</div>'};
  }
  if(drafts.length){
    const w=drafts[drafts.length-1];
    return {sub:(w.label||w.slug)+' — not locked yet',
      html:'<div class="note">🛠 <b>'+esc(w.label||w.slug)+' is still being built.</b> Picks open the moment the commissioner locks the slate — you\'ll get a text and an email with your PIN and a link straight back here. <b>Nothing for you to do right now.</b><br><br>You\'re signed in, so that link will drop you straight onto your card.</div>'};
  }
  return {sub:'No week is open yet — you are signed in and ready',
    html:'<div class="note">⏳ <b>No week has been set up yet.</b> Picks open when the commissioner builds and locks a slate; you\'ll get a text and an email the moment that happens. <b>Nothing for you to do right now.</b><br><br>Meanwhile the pool lives at <a href="/pool/football">/pool/football</a>.</div>'};
}
/* SIGNING IN AND FINDING A SLATE ARE TWO DIFFERENT QUESTIONS — answer them in that order.
   Until 2026-08-08 this function bailed out at "no open slate" BEFORE the PIN was ever checked,
   so between weeks the Enter button did nothing observable: no error on a wrong PIN, no session,
   and the login card left sitting on screen under a note. On a phone that reads as "I signed in
   but it still wants my PIN" — which was exactly right, because nothing had signed in.
   And when a week WAS open, a wrong PIN was only caught via the `hidden` mask on an EXISTING
   entry, so a first-time player could get all the way to save_picks before being rejected. */
async function enter(){
  const who=document.getElementById('who').value;
  const p=document.getElementById('pin').value.trim();
  if(!who||who==='No players set'||who==='Loading…'){toast('Pick your name first');return;}
  if(!p){toast('Enter your PIN');return;}
  let auth;
  try{
    const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({action:'verify_pin',name:who,pin:p})});
    auth=await r.json();
    if(!r.ok){
      sessionStorage.removeItem('fb_me');            // a stale saved PIN must not keep re-failing
      toast(/pin/i.test(auth.error||'')?('Wrong PIN for '+who):(auth.error||'could not sign in'),5000);
      return;
    }
  }catch(e){toast('Could not reach the pool — check signal and try again',5000);return;}
  me=auth.name;pin=p;myId=auth.id;
  sessionStorage.setItem('fb_me',JSON.stringify({name:me,pin}));
  document.getElementById('login').style.display='none';
  document.getElementById('whoamiName').textContent=me;
  document.getElementById('whoami').style.display='flex';
  await loadWeek();
}
async function loadWeek(){
  slugName=await currentWeek();
  if(!slugName){
    const m=noSlateMessage();
    document.getElementById('sub').textContent=m.sub;
    document.getElementById('bar').style.display='none';
    document.getElementById('content').innerHTML=m.html;
    return;
  }
  const j=await(await fetch(API+'?week='+slugName+'&name='+encodeURIComponent(me)+'&pin='+encodeURIComponent(pin),{cache:'no-store'})).json();
  week=j.data;
  /* IDENTITY (2026-08-07): picks are keyed by PERSON ID. The id now comes from sign-in; the name
     lookup stays as a fallback for the case where verify_pin returned before this page's roster. */
  const id=myId||((j.roster||[]).find(p=>String(p.name).toUpperCase()===String(me).toUpperCase())||{}).id;
  const mine=(week.picks||{})[id]
          || Object.values(week.picks||{}).find(v=>String(v.name||'').toUpperCase()===String(me).toUpperCase());
  picks=(mine&&mine.picks)||{};lockedMine=!!(mine&&mine.locked);
  render();
}
function signOut(){
  sessionStorage.removeItem('fb_me');
  me=pin=myId=week=slugName=null;picks={};lockedMine=false;
  document.getElementById('whoami').style.display='none';
  document.getElementById('bar').style.display='none';
  document.getElementById('content').innerHTML='';
  document.getElementById('pin').value='';
  document.getElementById('sub').textContent='Winners against the spread · lock before first kickoff';
  document.getElementById('login').style.display='block';
}
/* The PIN is the login, so the player has to own it. Until now only the commissioner could set
   one, which meant the only way to change your credential was to ask him — and he could then read
   it. Authenticates with the CURRENT pin: a change-password flow, not a reset. */
/* Changing your PIN must NOT depend on there being an open slate. The in-week button lives in the
   picks bar, which only renders after you log into a locked week — so between weeks (which is most
   of the time, and exactly when someone reads their JOIN text and taps the link) there was no way
   to reach it at all. This entry point works from the login card, any time. */
async function changePinStandalone(){
  const who=document.getElementById('who').value;
  const cur=document.getElementById('pin').value.trim();
  if(!who){toast('Pick your name first');return;}
  if(!cur){toast('Enter your CURRENT PIN first, then tap Change your PIN');return;}
  const next=window.prompt('New 4-digit PIN for '+who+':');
  if(next===null)return;
  try{
    const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({action:'set_pin',name:who,pin:cur,newPin:String(next).trim()})});
    const j=await r.json();
    if(!r.ok){toast(j.error||'could not change PIN',6000);return;}
    if(j.unchanged){toast('That is already your PIN');return;}
    document.getElementById('pin').value=String(next).trim();
    toast('PIN changed ✓ — use it from now on',6000);
  }catch(e){toast('could not change PIN',4000);}
}
async function changePin(){
  const next=window.prompt('New 4-digit PIN for '+me+':');
  if(next===null)return;
  try{
    const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({action:'set_pin',slug:slugName,name:me,pin,newPin:String(next).trim()})});
    const j=await r.json();
    if(!r.ok){toast(j.error||'could not change PIN',5000);return;}
    if(j.unchanged){toast('That is already your PIN');return;}
    pin=String(next).trim();
    sessionStorage.setItem('fb_me',JSON.stringify({name:me,pin}));   // stay logged in
    toast('PIN changed ✓ — use it next time',6000);
  }catch(e){toast('could not change PIN',4000);}
}
/* THE DEADLINE IS THE MOST IMPORTANT FACT ON THIS PAGE and it was 12px grey text in the header.
   Stated plainly at the top of the card list, in full ("Fri, Aug 14 · 7:00 PM ET"), with a live
   countdown, and it changes colour as it closes: blue → amber inside 6h → red once shut. A member
   who opens this on a phone should never have to work out whether they still have time. */
function deadlineBanner(){
  const el=document.getElementById('deadline');
  if(!el)return;
  if(!week||!week.deadline){el.style.display='none';return;}
  const ms=Date.parse(week.deadline)-Date.now();
  const when=new Date(week.deadline).toLocaleString('en-US',
    {timeZone:'America/New_York',weekday:'short',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});
  let cls='ok',cd='';
  if(ms<=0){cls='shut';cd='CLOSED';}
  else{
    const h=Math.floor(ms/3600000),m=Math.floor(ms%3600000/60000),d=Math.floor(h/24);
    cd=d>=1?(d+'d '+(h-d*24)+'h left'):(h>=1?(h+'h '+m+'m left'):(m+'m left'));
    if(ms<6*3600000)cls='soon';
  }
  el.style.display='flex';
  el.className='dl '+cls;
  el.innerHTML='<div><div class="k">'+(ms<=0?'Picks are closed':'All picks due by')+'</div><div class="v">'+esc(when)+' ET</div></div>'
    +'<div class="cd">'+cd+'</div>';
}
setInterval(deadlineBanner,30000);
function render(){
  document.getElementById('sub').textContent=(week.label||slugName)+' · picks close '+new Date(week.deadline).toLocaleString('en-US',{timeZone:'America/New_York',weekday:'short',hour:'numeric',minute:'2-digit'})+' ET';
  document.getElementById('bar').style.display='flex';
  // Locked is final: the controls go away rather than offering an undo that no longer exists.
  document.getElementById('lockbtn').style.display=lockedMine?'none':'';
  document.getElementById('savebtn').style.display=lockedMine?'none':'';
  const html=(week.games||[]).map(g=>{
    const mine=picks[g.id];
    /* PICK 'EM HAS NO LINE, so the old `('+'+g.line)` rendered a literal "+null" under every team
       on a preseason slate — 16 games of it. A pick'em is scored straight up, so the side carries
       no number at all. */
    const side=(ab)=>{
      const tag=g.pickem?'straight up':(g.favAbbrev===ab?('−'+g.line):('+'+g.line));
      return '<button class="side '+(mine===ab?'on':'')+'" '+(lockedMine?'disabled':'')+' onclick="pick(\''+g.id+'\',\''+ab+'\')">'+esc(ab)+' <span class="lab">'+tag+'</span></button>';
    };
    /* OVER/UNDER entries are picked OVER or UNDER, not by team — and the same fixture may also be
       on the slate against the spread, as a separate card. The header says which one you are
       looking at so the two are never confused. */
    const ouSide=(w)=>
      '<button class="side '+(mine===w?'on':'')+'" '+(lockedMine?'disabled':'')+' onclick="pick(\''+g.id+'\',\''+w+'\')">'+w
      +' <span class="lab">'+(w==='OVER'?'more than ':'less than ')+g.total+'</span></button>';
    if(g.market==='total'){
      return '<div class="game"><div class="ghead"><span>'+esc(g.short)+' · OVER/UNDER</span><span>'+
        new Date(g.date).toLocaleString('en-US',{timeZone:'America/New_York',weekday:'short',hour:'numeric',minute:'2-digit'})+' ET · total: <b>'+g.total+'</b></span></div>'+
        '<div class="sides">'+ouSide('OVER')+ouSide('UNDER')+'</div></div>';
    }
    return '<div class="game"><div class="ghead"><span>'+esc(g.short)+' · '+g.league.toUpperCase()+'</span><span>'+
      new Date(g.date).toLocaleString('en-US',{timeZone:'America/New_York',weekday:'short',hour:'numeric',minute:'2-digit'})+' ET · '+(g.pickem?'<b>PICK &rsquo;EM</b> — straight up':'line: '+esc(g.spreadText))+'</span></div>'+
      '<div class="sides">'+side(g.awayAbbrev)+side(g.homeAbbrev)+'</div></div>';
  }).join('');
  document.getElementById('content').innerHTML='<div class="dl" id="deadline" style="display:none"></div>'
    +(lockedMine
      ? '<div class="note">🔒 <b>Your picks are locked in.</b> Locking is final — these are your picks for the week. They stay hidden from everyone until the deadline, then the board goes live.</div>'
      : '<div class="note">💾 <b>Save</b> keeps your card editable right up to the deadline. <b>Save &amp; lock</b> submits it for good — you cannot change it afterwards. An unlocked card still counts at the deadline, but you\'ll be chased about it.</div>')
    +html;
  deadlineBanner();
  document.getElementById('prog').textContent=Object.keys(picks).length+'/'+(week.games||[]).length+' picked';
}
function pick(id,ab){if(lockedMine)return;picks[id]=ab;render();}
async function save(wantLock){
  if(lockedMine){toast('Your picks are locked in — they cannot be changed.',5000);return;}
  if(wantLock){
    const n=Object.keys(picks).length,total=(week.games||[]).length;
    if(n<total){toast('Pick all games first ('+n+'/'+total+')');return;}
    // Final means final. Say so before, not after.
    if(!confirm('Lock in your picks?\n\nThis is FINAL — you will not be able to change them.\nChoose Cancel and use Save if you want to keep editing until the deadline.'))return;
  }
  const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({action:'save_picks',slug:slugName,name:me,pin,picks,lock:!!wantLock})});
  const j=await r.json();
  if(!r.ok){toast([j.error,j.hint].filter(Boolean).join(' — ')||'save failed',7000);return;}
  lockedMine=j.locked;render();
  toast(wantLock?'🔒 Locked in. Good luck.':'Saved ✓ — you can still edit until the deadline',5000);
}
boot();
</script>
</body>
</html>
