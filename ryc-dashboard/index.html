<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RYC Portfolio Dashboard</title>
<style>
  :root {
    --bg: #f5f3ef; --bg-card: #f1f0eb; --surface: #fff; --text: #1a1a2e; --muted: #6b7280;
    --border: #e5e7eb; --accent: #2563eb; --green: #16a34a; --amber: #d97706;
    --red: #dc2626; --green-bg: #f0fdf4; --amber-bg: #fffbeb; --red-bg: #fef2f2;
    --green-border: #86efac; --amber-border: #fcd34d; --red-border: #fca5a5;
    --blue-bar: #3b82f6; --teal-bar: #0d9488; --amber-bar: #f59e0b; --purple-bar: #8b5cf6;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); line-height: 1.5; }

  /* Lock screen */
  #lock-screen { position: fixed; inset: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; z-index: 1000; }
  .lock-box { background: var(--surface); border-radius: 12px; padding: 48px 40px; text-align: center; width: 380px; box-shadow: 0 4px 24px rgba(0,0,0,0.06); }
  .lock-box img.lock-logo { height: 64px; width: auto; margin-bottom: 18px; }
  .lock-box h2 { font-size: 20px; font-weight: 600; margin-bottom: 4px; }
  .lock-box .subtitle { color: var(--muted); font-size: 13px; margin-bottom: 24px; }
  .lock-box input { width: 100%; padding: 11px 14px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; outline: none; background: var(--bg); }
  .lock-box input:focus { border-color: var(--accent); background: #fff; }
  .lock-box button { margin-top: 14px; width: 100%; padding: 11px; background: var(--accent); color: #fff; border: none; border-radius: 8px; font-size: 14px; font-weight: 500; cursor: pointer; }
  .lock-box .error { color: var(--red); font-size: 12px; margin-top: 8px; display: none; }

  /* App */
  #app { display: none; max-width: 1320px; margin: 0 auto; padding: 28px; }
  header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
  header .brand { display: flex; align-items: center; gap: 14px; }
  header .brand img { height: 44px; width: auto; display: block; }
  header h1 { font-size: 22px; font-weight: 600; }
  header .meta { font-size: 12px; color: var(--muted); }
  .refresh-btn { padding: 5px 12px; border: 1px solid var(--border); border-radius: 6px; font-size: 12px; background: var(--surface); cursor: pointer; margin-left: 8px; }
  .refresh-btn:hover { background: var(--bg-card); }

  /* View toggle */
  .view-toggle { display: flex; gap: 0; margin-bottom: 2rem; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; width: fit-content; }
  .view-toggle button { padding: 8px 20px; border: none; background: var(--surface); font-size: 13px; font-weight: 500; cursor: pointer; color: var(--muted); border-right: 1px solid var(--border); }
  .view-toggle button:last-child { border-right: none; }
  .view-toggle button.active { background: var(--accent); color: #fff; }

  /* Metrics */
  .metrics { display: flex; gap: 12px; margin-bottom: 2.5rem; }
  .metric-card { background: #f1f0eb; border-radius: 10px; padding: 14px 16px; flex: 1; min-width: 0; }
  .metric-card .label { font-size: 11px; color: var(--muted); margin-bottom: 3px; }
  .metric-card .value { font-size: 22px; font-weight: 600; }
  .metric-card .sub { font-size: 11px; color: var(--muted); margin-top: 2px; }

  /* Section headers */
  .section-header { font-size: 18px; font-weight: 500; margin-bottom: 16px; padding-bottom: 8px; border-bottom: 2px solid var(--border); }

  /* Breakdown */
  .breakdown { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; margin-bottom: 2.5rem; }
  .breakdown-card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 16px; }
  .breakdown-card .type-label { font-size: 13px; font-weight: 600; margin-bottom: 10px; }
  .breakdown-card .stat { display: flex; justify-content: space-between; font-size: 13px; padding: 3px 0; }
  .breakdown-card .stat .k { color: var(--muted); }
  .revenue-bar { height: 6px; border-radius: 3px; background: #e8e7e3; margin-top: 10px; overflow: hidden; }
  .revenue-bar .fill { height: 100%; border-radius: 3px; transition: width 0.5s ease; }

  /* Filter bar */
  .job-controls { display: flex; gap: 10px; margin-bottom: 16px; align-items: center; flex-wrap: wrap; }
  .job-controls input[type="text"] { min-width: 180px; padding: 7px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 13px; background: var(--surface); outline: none; }
  .job-controls input[type="text"]:focus { border-color: var(--accent); }
  .job-controls select { padding: 7px 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 12px; background: var(--surface); outline: none; cursor: pointer; color: var(--text); flex-shrink: 0; }
  .filter-pills { display: flex; gap: 0; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .filter-pills button { padding: 6px 12px; border: none; background: var(--surface); font-size: 12px; font-weight: 500; cursor: pointer; color: var(--muted); border-right: 1px solid var(--border); }
  .filter-pills button:last-child { border-right: none; }
  .filter-pills button.active { background: var(--accent); color: #fff; }
  .filter-pills button[data-sl="red"].active { background: var(--red); }
  .filter-pills button[data-sl="amber"].active { background: var(--amber); }
  .filter-pills button[data-sl="atrisk"].active { background: var(--red); }
  .sort-right { margin-left: auto; }

  /* Job cards */
  .job-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(400px, 1fr)); gap: 16px; margin-bottom: 2.5rem; }
  .job-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 22px; transition: box-shadow 0.15s; position: relative; }
  .job-card:hover { box-shadow: 0 2px 12px rgba(0,0,0,0.06); }
  .job-card.sl-green { border-left: 4px solid var(--green); }
  .job-card.sl-amber { border-left: 4px solid var(--amber); }
  .job-card.sl-red { border-left: 4px solid var(--red); }
  .job-card.sl-gray { border-left: 4px solid #d1d5db; }
  .job-card .job-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 6px; }
  .job-card .job-name { font-size: 16px; font-weight: 500; }
  .job-card .job-client { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .job-card .personnel { font-size: 12px; color: var(--muted); margin-bottom: 12px; display: none; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 500; }
  .badge-live { background: var(--green-bg); color: var(--green); border: 1px solid var(--green-border); }
  .badge-completed { background: #f3f4f6; color: var(--muted); }
  .badge-stage { background: #e0e7ff; color: #3730a3; }
  .badge-stage-null { background: #f3f4f6; color: #9ca3af; }
  .badge-school { background: #ede9fe; color: #7c3aed; }
  .badge-municipal { background: #dbeafe; color: #2563eb; }
  .badge-commercial { background: #fef3c7; color: #92400e; }
  .badge-mixed_use { background: #fce7f3; color: #be185d; }
  .badge-municipal_water_wastewater { background: #ccfbf1; color: #0f766e; }
  .badge-industrial { background: #e2e8f0; color: #475569; }
  .badge-private { background: #f3f4f6; color: #374151; }
  .badge-sp { background: #e0f2fe; color: #0369a1; font-size: 10px; }
  .badge-procore { background: #fef9c3; color: #854d0e; font-size: 10px; }
  .badges { display: flex; gap: 4px; flex-wrap: wrap; }

  /* Stoplight */
  .stoplight { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 6px; flex-shrink: 0; }
  .stoplight-green { background: var(--green); }
  .stoplight-amber { background: var(--amber); }
  .stoplight-red { background: var(--red); }
  .stoplight-gray { background: #d1d5db; }

  .job-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 16px; margin-top: 14px; }
  .job-stat { font-size: 12px; }
  .job-stat .k { color: var(--muted); display: block; margin-bottom: 1px; }
  .job-stat .v { font-weight: 500; font-size: 14px; }
  .flag-red { color: var(--red) !important; font-weight: 600 !important; }
  .flag-amber { color: var(--amber) !important; font-weight: 500 !important; }
  .margin-green { color: var(--green); } .margin-amber { color: var(--amber); } .margin-red { color: var(--red); }
  .margin-missing { color: var(--muted); font-style: italic; }


  /* Pre-con pending state */
  .precon-pending .job-stat .v { color: #d1d5db; }
  .precon-pending .job-stat .k { color: #d1d5db; }
  .precon-note { font-size: 12px; color: var(--muted); font-style: italic; grid-column: 1 / -1; padding: 8px 0 0; }

  /* Stage warning icon */
  .stage-warn { cursor: default; position: relative; margin-left: 3px; }
  .stage-warn .tooltip { display: none; position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%); background: #1a1a2e; color: #fff; font-size: 11px; padding: 6px 10px; border-radius: 6px; white-space: nowrap; z-index: 10; margin-bottom: 4px; }
  .stage-warn:hover .tooltip { display: block; }

  .dq-confirmed::after { content: ' ✓'; color: var(--green); font-size: 10px; }
  .dq-estimated::after { content: ' ~'; color: var(--amber); font-size: 10px; }
  .dq-missing::after { content: ' ?'; color: var(--red); font-size: 10px; }

  .live-dot { display: inline-block; width: 8px; height: 8px; background: var(--green); border-radius: 50%; margin-right: 4px; animation: pulse 2s infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

  .action-items { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border); display: flex; align-items: center; gap: 8px; }
  .action-items .label { font-size: 11px; color: var(--muted); }
  .action-items .count { font-size: 20px; font-weight: 600; }
  .action-items .touched { font-size: 11px; color: var(--muted); margin-left: auto; }

  .note { font-size: 11px; color: var(--muted); font-style: italic; }

  /* Stoplight reason */
  .sl-reason { font-size: 11px; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); }
  .sl-reason-red { color: var(--red); }
  .sl-reason-amber { color: var(--amber); }
  /* Customer Success (Buildr) block */
  .cs-block { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); font-size: 12px; }
  .cs-block.cs-attn { border-top-color: var(--amber); }
  .cs-block summary { cursor: pointer; list-style: none; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  .cs-block summary::-webkit-details-marker { display: none; }
  .cs-block summary::before { content: '▸'; color: var(--muted); font-size: 10px; }
  .cs-block[open] summary::before { content: '▾'; }
  .cs-empty { display: flex; gap: 8px; align-items: center; }
  .cs-tag { font-weight: 600; color: var(--text); }
  .cs-none, .cs-summary-meta { color: var(--muted); }
  .cs-chip { font-size: 10px; padding: 1px 7px; border-radius: 10px; border: 1px solid var(--border); }
  .cs-on { background: #dcfce7; color: #166534; border-color: #bbf7d0; }
  .cs-off { background: var(--surface); color: var(--muted); }
  .cs-summary-meta { font-size: 11px; }
  .cs-i { color: var(--amber); } .cs-o { color: #2563eb; }
  .cs-detail { margin-top: 8px; padding-left: 6px; border-left: 2px solid var(--border); }
  .cs-row { display: flex; gap: 8px; padding: 6px 0; border-bottom: 1px dashed var(--border); }
  .cs-row:last-child { border-bottom: none; }
  .cs-mtype { font-size: 9px; text-transform: uppercase; font-weight: 700; padding: 1px 6px; border-radius: 4px; height: fit-content; background: #e0e7ff; color: #3730a3; }
  .cs-mtype.cs-kickoff { background: #dcfce7; color: #166534; }
  .cs-mtype.cs-closeout { background: #fee2e2; color: #991b1b; }
  .cs-mtype.cs-progress { background: #dbeafe; color: #1e40af; }
  .cs-date { color: var(--muted); font-size: 11px; white-space: nowrap; min-width: 56px; }
  .cs-title { font-weight: 600; }
  .cs-notes { color: var(--muted); white-space: pre-wrap; margin-top: 2px; font-size: 11px; }
  .cs-meta { color: var(--muted); font-size: 11px; }
  .cs-sub { font-weight: 700; font-size: 10px; text-transform: uppercase; color: var(--muted); margin: 8px 0 2px; }
  .cs-flag { color: var(--amber); min-width: 14px; }
  .cs-opp .cs-flag { color: #2563eb; }

  /* Foundation integration */
  .foundation-line { font-size: 11px; margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--border); color: var(--muted); line-height: 1.7; }
  .foundation-line .fl-label { display:inline-block; font-weight:600; color:#0891b2; letter-spacing:.04em; text-transform:uppercase; font-size:10px; margin-right:6px; }
  .recon-ok { color: var(--green); }
  .recon-warn { color: var(--amber); }
  .integrity-flag { display:inline-block; margin-top:4px; padding:1px 6px; border-radius:4px; background:#fef3c7; color:#92400e; font-size:10px; font-weight:600; }
  .contract-flag { color: var(--amber); font-size:11px; font-weight:600; }
  .coverage-banner { background:#ecfeff; border:1px solid #a5f3fc; border-left:4px solid #0891b2; border-radius:8px; padding:10px 14px; margin-bottom:14px; font-size:13px; color:#155e63; }
  .coverage-banner strong { color:#0e7490; }
  .job-people { font-size: 12px; color: var(--muted); margin-top: 3px; }
  .job-people strong { color: #1f2937; font-weight: 700; }

  /* Billing & AR */
  .billing-stamp { font-size: 11px; color: var(--muted); margin-bottom: 14px; }
  .billing-block { margin-bottom: 2.2rem; }
  .billing-block .section-header { display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; }
  .billing-block .big-num { font-size: 20px; font-weight: 700; color:#0e7490; }
  .billing-block .cnt { font-size: 12px; color: var(--muted); font-weight:400; }
  .billing-sub { font-size: 12px; color: var(--muted); margin: 4px 0 12px; font-style: italic; }
  .billing-table { width:100%; border-collapse: collapse; font-size: 13px; background:#fff; border:1px solid var(--border); border-radius:8px; overflow:hidden; }
  .billing-table th { text-align:left; padding:8px 12px; background:#f1f0eb; color:var(--muted); font-weight:600; font-size:11px; text-transform:uppercase; letter-spacing:.03em; }
  .billing-table td { padding:7px 12px; border-top:1px solid var(--border); }
  .billing-table td.r, .billing-table th.r { text-align:right; font-variant-numeric: tabular-nums; }
  .billing-table .jno { color:var(--muted); font-variant-numeric: tabular-nums; margin-right:4px; }
  .billing-table .pm-row td { background:#fafaf8; border-top:2px solid var(--border); }
  .billing-table .under { color:#b45309; font-weight:600; }
  .billing-table .over-60 { color: var(--red); font-weight:600; }
  .billing-empty, .billing-note, .billing-more { color: var(--muted); padding:12px; font-size:13px; }
  .billing-table .over { color:#0e7490; font-weight:600; }
  .billing-table .ontrack { color: var(--muted); font-size:12px; }
  .billing-table .muted-cell { color: var(--border); }
  .kpi-band { display:flex; gap:14px; flex-wrap:wrap; margin-bottom:2rem; }
  .kpi-card { flex:1 1 160px; background:#fff; border:1px solid var(--border); border-radius:10px; padding:16px 18px; }
  .kpi-val { font-size:26px; font-weight:700; color:#0e7490; font-variant-numeric: tabular-nums; }
  .kpi-val.kpi-warn { color:#b45309; }
  .kpi-label { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; margin-top:4px; }
  .billing-toggle { margin-left:auto; font-size:12px; padding:4px 12px; border:1px solid var(--border); border-radius:6px; background:#fff; color:var(--muted); cursor:pointer; }
  .billing-toggle:hover { background:#f1f0eb; color:var(--text); }
  .billing-details { margin-bottom:2.2rem; background:#fff; border:1px solid var(--border); border-radius:8px; padding:0 14px; }
  .billing-details summary { cursor:pointer; padding:12px 0; font-weight:600; font-size:14px; color:var(--text); }
  .billing-details[open] summary { border-bottom:1px solid var(--border); margin-bottom:12px; }
  .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.6s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .footer { text-align: center; padding: 32px; color: var(--muted); font-size: 11px; line-height: 1.8; }
</style>
</head>
<body>

<div id="lock-screen">
  <div class="lock-box">
    <img class="lock-logo" src="/ryc-dashboard/RYC_Shield_Orange.png" alt="R. Yoder Construction">
    <h2>RYC Portfolio Dashboard</h2>
    <div class="subtitle">R. Yoder Construction</div>
    <input type="password" id="pw-input" placeholder="Password" autofocus>
    <button onclick="tryLogin()">Enter</button>
    <div class="error" id="pw-error">Incorrect password</div>
  </div>
</div>

<div id="app">
  <header>
    <div class="brand">
      <img src="/ryc-dashboard/RYC_Shield_Orange.png" alt="R. Yoder Construction">
      <div><h1>RYC Portfolio Dashboard</h1><div class="meta">v1.11.0-ryc-dashboard</div></div>
    </div>
    <div style="display:flex;align-items:center">
      <div class="meta" id="refresh-status"></div>
      <button class="refresh-btn" id="btn-refresh" onclick="triggerRefresh()">Refresh Procore</button>
    </div>
  </header>

  <div class="view-toggle" id="view-toggle">
    <button class="active" data-view="active">Active Jobs</button>
    <button data-view="completed">Completed Jobs</button>
    <button data-view="closeout">Warranty/Post-Con</button>
    <button data-view="billing">Billing &amp; AR</button>
    <button data-view="analysis">Portfolio Analysis</button>
  </div>

  <div class="metrics" id="metrics"></div>
  <div id="coverage-banner" style="display:none"></div>
  <div id="analysis-section" style="display:none"></div>
  <div id="billing-section" style="display:none"></div>
  <div id="jobs-section">
    <div class="job-controls" id="job-controls" style="display:none">
      <input type="text" id="job-search" placeholder="Search jobs, clients, PMs..." oninput="renderJobs()">
      <div class="filter-pills" id="sl-filter">
        <button class="active" data-sl="all" onclick="setSLFilter('all')">All</button>
        <button data-sl="red" onclick="setSLFilter('red')">Red</button>
        <button data-sl="amber" onclick="setSLFilter('amber')">Amber</button>
        <button data-sl="atrisk" onclick="setSLFilter('atrisk')">At risk</button>
      </div>
      <select id="filter-stage" onchange="renderJobs()">
        <option value="">All stages</option>
        <option value="Pre-Construction">Pre-Construction</option>
        <option value="Course of Construction">Course of Construction</option>
        <option value="closeout">Closeout</option>
      </select>
      <select id="filter-client" onchange="renderJobs()">
        <option value="">All types</option>
        <option value="municipal_water_wastewater">Water/WW</option>
        <option value="commercial">Commercial</option>
        <option value="municipal">Municipal</option>
        <option value="school">School</option>
        <option value="industrial">Industrial</option>
        <option value="mixed_use">Mixed use</option>
      </select>
      <select id="filter-pm" onchange="renderJobs()"></select>
      <select id="job-sort" class="sort-right" onchange="renderJobs()">
        <option value="stoplight">Sort: Stoplight</option>
        <option value="contract">Sort: Contract value ↓</option>
        <option value="finish">Sort: Finish date ↑</option>
        <option value="pct">Sort: % Complete ↓</option>
        <option value="pm">Sort: Project Manager (A–Z)</option>
      </select>
    </div>
    <div class="job-grid" id="job-grid"></div>
  </div>

  <div class="footer">
    v1.11.0-ryc-dashboard — Data from Procore (PM) + Foundation (accounting)<br>
    Jobs showing overdue may need status update in Procore. Margin data not tracked in Procore commitments.
  </div>
</div>

<script>
const PORTFOLIO_URL = '/ryc-dashboard/ryc-portfolio.json';
const CACHE_URL = '/ryc-dashboard/procore-cache.json';
const ACTIVE_API = '/api/ryc-active';
const FOUNDATION_API = 'https://crm.jbkdevelopment.com/api/ryc-foundation';
const AR_API = 'https://crm.jbkdevelopment.com/api/ryc-ar';
const BUILDR_API = 'https://crm.jbkdevelopment.com/api/ryc-buildr';
let portfolioData = null, activeData = null, foundationData = null, foundationOnly = [], arData = null, buildrData = null, currentView = 'active';

function tryLogin() {
  if (document.getElementById('pw-input').value === 'ryc2026') {
    document.getElementById('lock-screen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    sessionStorage.setItem('ryc-auth', '1');
    init();
  } else { document.getElementById('pw-error').style.display = 'block'; }
}
document.getElementById('pw-input').addEventListener('keydown', e => { if (e.key === 'Enter') tryLogin(); });
if (sessionStorage.getItem('ryc-auth') === '1') {
  document.getElementById('lock-screen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  init();
}

async function init() {
  try { portfolioData = await (await fetch(PORTFOLIO_URL)).json(); } catch { portfolioData = { jobs: [], activeJobs: [] }; }
  document.getElementById('refresh-status').innerHTML = '<span class="spinner"></span>';
  try {
    activeData = await (await fetch(CACHE_URL + '?t=' + Date.now())).json();
    document.getElementById('refresh-status').textContent = 'Procore data from ' + fmtDate(activeData?.refreshed);
  } catch { document.getElementById('refresh-status').textContent = 'Procore data unavailable'; activeData = null; }
  try { foundationData = await (await fetch(FOUNDATION_API + '?t=' + Date.now())).json(); } catch { foundationData = null; }
  try { buildrData = await (await fetch(BUILDR_API + '?t=' + Date.now())).json(); } catch { buildrData = null; }
  mergeFoundation(activeData, foundationData); // best-source merge; no-op/Procore-only if Foundation unreachable
  renderView();
  wireToggle();
}

async function triggerRefresh() {
  const btn = document.getElementById('btn-refresh');
  const status = document.getElementById('refresh-status');
  btn.textContent = 'Refreshing...'; btn.disabled = true;
  status.textContent = 'Triggering Procore refresh...';
  try {
    const r = await fetch(ACTIVE_API, { method: 'POST' });
    const d = await r.json();
    if (d.status === 'started' || d.status === 'already_running') {
      status.textContent = 'Refresh running — data updates in ~2-3 min. Page will reload.';
      // Poll for completion, then wait for Vercel redeploy
      const poll = setInterval(async () => {
        try {
          const sr = await fetch(ACTIVE_API + '?check=status');
          const sd = await sr.json();
          if (sd.last_result === 'completed') {
            clearInterval(poll);
            status.textContent = 'Refresh done — waiting for Vercel deploy (~60s)...';
            setTimeout(async () => { await init(); btn.textContent = 'Refresh Procore'; btn.disabled = false; }, 75000);
          } else if (sd.last_result && sd.last_result !== null && !sd.running) {
            clearInterval(poll);
            status.textContent = 'Refresh finished: ' + sd.last_result;
            btn.textContent = 'Refresh Procore'; btn.disabled = false;
          }
        } catch {}
      }, 10000);
    } else {
      status.textContent = 'Refresh ' + (d.status || 'unknown') + '. Try again.';
      btn.textContent = 'Refresh Procore'; btn.disabled = false;
    }
  } catch {
    status.textContent = 'Could not reach refresh service.';
    btn.textContent = 'Refresh Procore'; btn.disabled = false;
  }
}

// --- Helpers ---
function fmt(n) { return n == null ? '\u2014' : '$' + Math.round(n).toLocaleString('en-US'); }
function fmtCompact(n) { if (n == null) return '\u2014'; const abs = Math.abs(n); const sign = n < 0 ? '-' : ''; if (abs >= 1e6) return sign + '$' + (abs / 1e6).toFixed(1) + 'M'; if (abs >= 1e3) return sign + '$' + Math.round(abs / 1e3).toLocaleString('en-US') + 'K'; return sign + '$' + Math.round(abs).toLocaleString('en-US'); }
function fmtCO(co) { if (!co || co.count === 0) return '\u2014'; const sign = co.netValue >= 0 ? '+' : ''; let txt = co.count + ' COs \u00b7 ' + sign + fmtCompact(co.netValue); if (co.byType && Object.keys(co.byType).length > 0) { const parts = Object.entries(co.byType).sort((a, b) => b[1] - a[1]).map(([t, n]) => n + ' ' + t); txt += '<br><span class="note">' + parts.join(' \u00b7 ') + '</span>'; } return txt; }
function pct(n) { return n == null ? '\u2014' : n.toFixed(1) + '%'; }
function fmtDate(d) { if (!d) return '\u2014'; const dt = new Date(d); return isNaN(dt) ? '\u2014' : dt.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric', hour: '2-digit', minute: '2-digit' }); }
function fmtShort(d) { if (!d) return '\u2014'; const dt = new Date(d); return isNaN(dt) ? '\u2014' : dt.toLocaleDateString('en-US', { month: 'short', year: 'numeric' }); }
function marginClass(m) { return m == null ? 'margin-missing' : m >= 12 ? 'margin-green' : m >= 8 ? 'margin-amber' : 'margin-red'; }
function dqClass(q) { return 'dq-' + (q || 'missing'); }
function typeColor(t) { return { school: 'var(--blue-bar)', municipal: 'var(--teal-bar)', municipal_water_wastewater: '#0891b2', commercial: 'var(--amber-bar)', mixed_use: 'var(--purple-bar)', industrial: '#78716c' }[t] || '#9ca3af'; }
function typeName(t) { return { school: 'School', municipal: 'Municipal', municipal_water_wastewater: 'Municipal \u2013 Water/WW', commercial: 'Commercial', mixed_use: 'Mixed use', industrial: 'Industrial', private: 'Private', new_construction: 'New construction', renovation: 'Renovation', repair: 'Repair', addition: 'Addition', expansion: 'Expansion' }[t] || t; }
function esc(s) { if (!s) return ''; const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
function contractedMargin(job) { const cv = job.contractValue; const bo = job.budget?.original; if (!(cv > 0 && bo > 0)) return null; return bo >= cv ? 0 : ((cv - bo) / cv * 100); }
function marginToDate(job) { const cv = job.contractValue; const dc = (job.costToDate != null ? job.costToDate : job.budget?.direct); return (cv > 0 && dc > 0) ? ((cv - dc) / cv * 100) : null; }
function marginColorClass(m) { return m == null ? 'margin-missing' : m >= 10 ? 'margin-green' : m >= 5 ? 'margin-amber' : 'margin-red'; }

function getLP(pid) { return activeData?.jobs?.find(j => j.procoreId === pid) || null; }
function getBestMargin(j) { return j.projectedMarginPct ?? j.projectedMargin ?? (j.impliedMarginPct != null && j.impliedMarginPct < 40 ? j.impliedMarginPct : null); }
// PM = Foundation-authoritative (Procore PM is unreliable), fallback Procore.
// Site super removed from the UI — Foundation has no super field and Procore's is largely wrong/empty.
function pmName(job) { return (job.foundation && job.foundation.pmName) || job.pm?.name || null; }

// --- Foundation merge (best-source per field + integrity flags) ---
// Merges the Foundation accounting snapshot onto each Procore job by jobNo === projectNumber.
// Foundation wins contract/cost/lifecycle; Procore keeps schedule/RFIs/CO-type. Pure Procore-only
// render if Foundation is unreachable (foundationData null → every job gets foundation:null).
function mergeFoundation(active, fd) {
  foundationOnly = [];
  if (!active || !active.jobs) return;
  const fjobs = (fd && fd.jobs) || {};
  const procoreNums = new Set();
  for (const j of active.jobs) {
    const num = (j.projectNumber || '').trim();
    procoreNums.add(num);
    const f = fjobs[num];
    j.flags = [];
    if (!f) { j.foundation = null; j.costToDate = j.budget?.direct ?? null; continue; }
    j.foundation = f;
    // Contract — best source = Foundation executed contract (original + approved COs)
    if (f.currentContract > 0) {
      j.procoreContractValue = j.contractValue;
      j.contractValue = f.currentContract;
      const d = j.contractValue - (j.procoreContractValue || 0);
      if (j.procoreContractValue && Math.abs(d) > 50000 && Math.abs(d) > j.contractValue * 0.02) {
        j.flags.push({ type: 'contract', text: 'Procore ' + fmtCompact(j.procoreContractValue) });
      }
    }
    // Cost-to-date — prefer Foundation (authoritative, includes burden)
    j.costToDate = (f.totalCosts != null) ? f.totalCosts : (j.budget?.direct ?? null);
    // Recompute overrun against the corrected contract so the stoplight stays consistent
    if (j.costToDate != null && j.contractValue > 0) j.costOverrun = j.costToDate > j.contractValue;
    // Lifecycle — Foundation job_status is authoritative
    if (f.jobStatus === 'C') j.flags.push({ type: 'closed', text: 'Foundation: closed' });
  }
  // Coverage gap — active Foundation jobs with a real contract that aren't on the board
  foundationOnly = Object.values(fjobs).filter(f =>
    f.jobStatus === 'A' && !procoreNums.has((f.jobNo || '').trim()) &&
    ((f.currentContract || 0) > 0 || (f.originalContract || 0) > 0));
}

function renderFoundationLine(job) {
  const f = job.foundation;
  if (!f) return '';
  const chips = Object.entries(f.costBreakdown || {}).sort((a, b) => b[1] - a[1]).slice(0, 4)
    .map(([k, v]) => esc(k) + ' ' + fmtCompact(v)).join(' · ');
  let recon = '';
  const pCost = job.budget?.direct;
  if (pCost != null && f.totalCosts != null) {
    const d = f.totalCosts - pCost;
    recon = (Math.abs(d) <= Math.max(50000, (job.contractValue || 0) * 0.02))
      ? '<span class="recon-ok">✓ reconciled</span>'
      : '<span class="recon-warn">Δ vs Procore ' + fmtCompact(d) + '</span>';
  }
  const flags = (job.flags || []).map(fl => '<span class="integrity-flag">⚑ ' + esc(fl.text) + '</span>').join(' ');
  return `<div class="foundation-line"><span class="fl-label">Foundation</span>Cost ${fmtCompact(f.totalCosts)} ${recon} · Billed ${fmtCompact(f.totalInvoiced)} · Retainage ${fmtCompact(f.retainage)}${chips ? '<br><span class="note">' + chips + '</span>' : ''}${flags ? '<br>' + flags : ''}</div>`;
}

function renderPeopleLine(job) {

}

function renderCoverageBanner() {
  const el = document.getElementById('coverage-banner');

  const onBoard = activeData?.jobs?.length || 0;

}

// --- Stoplight ---
function getStoplight(job, live) {
  const stage = live?.stage || null;
  const pctComp = live?.pctComplete;
  const costOverrun = live?.costOverrun;
  const finishDate = live?.projectedFinish || live?.completionDate;
  const verifyStatus = live?.verifyStatus;
  const cMargin = contractedMargin(job);
  const mtd = marginToDate(job);
  const co = live?.changeOrders;
  const coExposure = (co?.netValue && job.contractValue) ? Math.abs(co.netValue) / job.contractValue : 0;

  // Gray — Pre-Construction or no data yet
  const isPrecon = stage === 'Pre-Construction' || (!live?.budget && (pctComp == null || pctComp === 0));
  if (isPrecon) return { color: 'gray', reasons: [] };

  // Days overdue
  const daysOverdue = finishDate ? Math.floor((Date.now() - new Date(finishDate)) / 86400000) : 0;

  // Collect reasons
  const reasons = [];

  // Red — action required
  if (costOverrun) reasons.push({ level: 'red', text: 'Cost overrun' });
  if (mtd != null && mtd < 0) reasons.push({ level: 'red', text: 'Margin to date ' + mtd.toFixed(1) + '%' });
  if (daysOverdue > 30 && !verifyStatus) reasons.push({ level: 'red', text: Math.abs(daysOverdue) + ' days past projected finish' });

  const red = reasons.some(r => r.level === 'red');

  // Amber — watch closely
  if (!red) {
    if (cMargin != null && cMargin > 0 && cMargin < 5) reasons.push({ level: 'amber', text: 'Contracted margin ' + cMargin.toFixed(1) + '% (below 5%)' });
    if (pctComp != null && pctComp >= 10 && mtd != null && cMargin != null && mtd < cMargin) reasons.push({ level: 'amber', text: 'Margin declining · ' + mtd.toFixed(1) + '% vs ' + cMargin.toFixed(1) + '% contracted' });
    if (daysOverdue >= 1 && daysOverdue <= 30) reasons.push({ level: 'amber', text: daysOverdue + ' days past projected finish' });
    if (coExposure > 0.07) reasons.push({ level: 'amber', text: 'CO exposure ' + (coExposure * 100).toFixed(1) + '% of contract' });
    if (finishDate && !verifyStatus && daysOverdue <= 0 && Math.abs(daysOverdue) <= 30) reasons.push({ level: 'amber', text: 'Finishing in ' + Math.abs(daysOverdue) + ' days' });
  }

  const amber = !red && reasons.some(r => r.level === 'amber');

  return { color: red ? 'red' : amber ? 'amber' : 'green', reasons };
}

// --- Metrics ---
function renderMetrics() {
  const el = document.getElementById('metrics');
  if (currentView === 'active' || currentView === 'closeout') {
    const active = currentView === 'closeout' ? getCloseoutJobs() : getActiveJobs();
    const totalContract = active.reduce((s, j) => s + (j.contractValue || 0), 0);
    let totalDirect = 0, pctVals = [];
    let redCount = 0, amberCount = 0, finishing90 = 0;
    const now = new Date(), in90 = new Date(now.getTime() + 90 * 86400000);
    for (const j of active) {
      if (j.budget?.direct) totalDirect += j.budget.direct;
      if (j.pctComplete != null) pctVals.push(Math.min(j.pctComplete, 100));
      const sl = getStoplight(j, j).color;
      if (sl === 'red') redCount++;
      if (sl === 'amber') amberCount++;
      const fin = j.projectedFinish || j.completionDate;
      if (fin) {
        const fd = new Date(fin);
        if (fd >= now && fd <= in90) finishing90++;
      }
    }
    const avgPct = pctVals.length ? pctVals.reduce((s, v) => s + v, 0) / pctVals.length : null;
    el.innerHTML = `
      <div class="metric-card"><div class="label">Active contract value</div><div class="value">${fmt(totalContract)}</div><div class="sub">${active.length} active jobs</div></div>
      <div class="metric-card"><div class="label">Direct cost to date</div><div class="value">${fmt(totalDirect)}</div><div class="sub">Across all active</div></div>
      <div class="metric-card"><div class="label">Avg % complete</div><div class="value">${avgPct != null ? pct(avgPct) : '\u2014'}</div><div class="sub">(${pctVals.length} of ${active.length} jobs)</div></div>
      <div class="metric-card"><div class="label">Red</div><div class="value${redCount > 0 ? ' flag-red' : ''}">${redCount}</div><div class="sub">Action required</div></div>
      <div class="metric-card"><div class="label">Amber</div><div class="value${amberCount > 0 ? ' flag-amber' : ''}">${amberCount}</div><div class="sub">Watch closely</div></div>
      <div class="metric-card"><div class="label">Finishing in 90 days</div><div class="value" style="${finishing90 > 0 ? 'color:var(--green)' : ''}">${finishing90}</div><div class="sub">Projected finish within 90d</div></div>`;
  } else {
    const completed = portfolioData?.jobs || [];
    const totalRev = completed.reduce((s, j) => s + (j.contractFinal || 0), 0);
    const margins = completed.map(getBestMargin).filter(m => m != null);
    const avgM = margins.length ? margins.reduce((s, m) => s + m, 0) / margins.length : null;
    const overruns = completed.map(j => j.scheduleOverrunMonths).filter(m => m != null);
    const avgO = overruns.length ? overruns.reduce((s, m) => s + m, 0) / overruns.length : null;
    el.innerHTML = `
      <div class="metric-card"><div class="label">Total revenue</div><div class="value">${fmt(totalRev)}</div><div class="sub">${completed.length} completed jobs</div></div>
      <div class="metric-card"><div class="label">Avg margin</div><div class="value ${marginClass(avgM)}">${avgM != null ? pct(avgM) : '\u2014'}</div><div class="sub">${margins.length} of ${completed.length} with data</div></div>
      <div class="metric-card"><div class="label">Avg schedule overrun</div><div class="value">${avgO != null ? avgO.toFixed(1) + ' mo' : '\u2014'}</div><div class="sub">${overruns.length} jobs measured</div></div>`;
  }
}

function renderAnalysis() {
  const all = [...(portfolioData?.jobs || []), ...(activeData?.jobs || []).map(a => ({ ...a, contractFinal: a.contractValue, clientType: a.clientType, workType: a.workType }))];
  let totalRev = 0;

    byClient[ct].count++; byClient[ct].revenue += rev;
    const m = getBestMargin(j); if (m != null) byClient[ct].margins.push(m);

    const wt = j.workType || 'other';
    if (!byWork[wt]) byWork[wt] = { count: 0, revenue: 0 };

  }

  let html = '<h3 class="section-header">Client type breakdown</h3><div class="breakdown">';
  for (const [type, data] of Object.entries(byClient)) {

    const pctRev = totalRev > 0 ? (data.revenue / totalRev * 100) : 0;
    html += `<div class="breakdown-card"><div class="type-label"><span class="badge badge-${type}">${typeName(type)}</span></div>
      <div class="stat"><span class="k">Jobs</span><span>${data.count}</span></div>
      <div class="stat"><span class="k">Revenue</span><span>${fmt(data.revenue)}</span></div>

      <div class="revenue-bar"><div class="fill" style="width:${pctRev}%;background:${typeColor(type)}"></div></div></div>`;

// --- Billing & AR (Phase 2, v2 — summary-first, anchored to active accounts) ---
async function renderBilling() {
  const el = document.getElementById('billing-section');
  if (!arData) {
    el.innerHTML = '<div class="billing-note"><span class="spinner"></span> Loading billing &amp; AR…</div>';
    try { arData = await (await fetch(AR_API + '?t=' + Date.now())).json(); }
    catch { arData = { invoices: [], summary: {}, error: 'unreachable' }; }
  }
  const stamp = arData?.refreshed ? `<div class="billing-stamp">AR as of ${fmtDate(arData.refreshed)} · Foundation refreshes nightly</div>` : '';
  el.innerHTML = stamp + sectionKPIs() + sectionActiveAccounts() + sectionOverdueAR() + sectionLegacyAR() + sectionPhantom();
}

// Set of active Foundation job numbers (job_status 'A'), to anchor AR to active work.
function activeJobSet() {
  const fj = (foundationData && foundationData.jobs) || {};
  const s = new Set();
  for (const j of Object.values(fj)) if (j.jobStatus === 'A') s.add(String(j.jobNo));
  return s;
}

// AR rows by category, optionally scoped to active vs. legacy (closed-job) jobs.
function arRows(cat, scope) {
  const active = scope ? activeJobSet() : null;
  return ((arData && arData.invoices) || []).filter(v => {
    if (v.category !== cat) return false;
    if (!scope) return true;
    const isActive = active.has(String(v.jobNo || ''));
    return scope === 'active' ? isActive : !isActive;
  });
}

// Overdue AR open balance summed per job number.
function overdueByJob(scope) {
  const m = {};
  for (const v of arRows('overdue', scope)) {
    const k = String(v.jobNo || '');
    m[k] = (m[k] || 0) + (v.openBalance || 0);
  }
  return m;
}

// One roll-up row per active Foundation job: billing position + overdue AR together.
// deficit = invoiced − cost-to-date × (original_contract / original_cost). < 0 ⇒ needs invoicing.
function activeAccountRows() {
  const fj = (foundationData && foundationData.jobs) || {};
  const odo = overdueByJob('active');
  const rows = [];
  for (const f of Object.values(fj)) {
    if (f.jobStatus !== 'A') continue;
    const cost = f.totalCosts || 0, estCost = f.originalCost || 0, invoiced = f.totalInvoiced || 0;
    const contract = f.currentContract || f.originalContract || 0;
    let deficit = null;
    if (cost > 0 && estCost > 0 && (f.originalContract || 0) > 0) {
      deficit = invoiced - cost * (f.originalContract / estCost);
    }
    rows.push({
      pm: f.pmName || '(no PM)', job: f.jobNo, name: f.description || '',
      contract, cost, invoiced, retainage: f.retainage || 0, deficit,
      under: deficit != null && deficit < 0 ? -deficit : 0,
      over: deficit != null && deficit > 0 ? deficit : 0,
      overdue: odo[String(f.jobNo)] || 0,
    });
  }
  return rows;
}

function sectionKPIs() {
  if (!foundationData || !foundationData.jobs) {
    return '<div class="kpi-band"><div class="billing-empty">Foundation data unavailable — billing &amp; AR summary can\'t be computed.</div></div>';
  }
  const accts = activeAccountRows();
  const needsInv = accts.reduce((s, r) => s + r.under, 0);
  const overdueActive = accts.reduce((s, r) => s + r.overdue, 0);
  const retain = accts.reduce((s, r) => s + r.retainage, 0);
  const flagged = accts.filter(r => r.under > 1000 || r.overdue > 0).length;
  const card = (label, val, cls) => `<div class="kpi-card"><div class="kpi-val ${cls || ''}">${val}</div><div class="kpi-label">${label}</div></div>`;
  return `<div class="kpi-band">
    ${card('Needs invoicing', fmtCompact(needsInv), 'kpi-warn')}
    ${card('Overdue AR · active', fmtCompact(overdueActive), 'kpi-warn')}
    ${card('Retainage held', fmtCompact(retain), '')}
    ${card('Active jobs flagged', flagged, '')}
  </div>`;
}

let billingShowAll = false;
function toggleBillingAll() { billingShowAll = !billingShowAll; renderBilling(); }

function sectionActiveAccounts() {
  const rows = activeAccountRows();
  const flagged = rows.filter(r => r.under > 1000 || r.overdue > 0);
  const shown = (billingShowAll ? rows.slice() : flagged.slice())
    .sort((a, b) => (b.under + b.overdue) - (a.under + a.overdue));
  let body;
  if (!foundationData || !foundationData.jobs) {
    body = '<div class="billing-empty">Foundation data unavailable.</div>';
  } else if (!shown.length) {
    body = '<div class="billing-empty">No active jobs need invoicing or carry overdue AR.</div>';
  } else {
    body = '<table class="billing-table"><thead><tr><th>Job</th><th>PM</th><th class="r">Contract</th><th class="r">Cost to date</th><th class="r">Billed</th><th class="r">Needs invoiced</th><th class="r">Retainage</th><th class="r">Overdue AR</th></tr></thead><tbody>';
    for (const r of shown) {
      const billCell = r.under > 0 ? `<span class="under">${fmtCompact(r.under)}</span>`
        : r.over > 0 ? `<span class="over">+${fmtCompact(r.over)} over</span>`
        : r.deficit == null ? '<span class="muted-cell">—</span>' : '<span class="ontrack">on track</span>';
      const odCell = r.overdue > 0 ? `<span class="under">${fmtCompact(r.overdue)}</span>` : '<span class="muted-cell">—</span>';
      body += `<tr><td><span class="jno">${esc(r.job)}</span> ${esc(r.name)}</td><td>${esc(r.pm)}</td><td class="r">${fmtCompact(r.contract)}</td><td class="r">${fmtCompact(r.cost)}</td><td class="r">${fmtCompact(r.invoiced)}</td><td class="r">${billCell}</td><td class="r">${r.retainage ? fmtCompact(r.retainage) : '<span class="muted-cell">—</span>'}</td><td class="r">${odCell}</td></tr>`;
    }
    body += '</tbody></table>';
  }
  const toggle = `<button class="billing-toggle" onclick="toggleBillingAll()">${billingShowAll ? 'Show flagged only' : 'Show all ' + rows.length + ' active jobs'}</button>`;
  return `<div class="billing-block">
    <h3 class="section-header">Active accounts — billing &amp; AR <span class="cnt">${flagged.length} flagged${billingShowAll ? ' · all shown' : ''}</span> ${toggle}</h3>
    <div class="billing-sub"><strong>Needs invoiced</strong> = cost-to-date × bid ratio (contract ÷ est. cost) − billed — directional (bid ratio, not Holly's hand-keyed OH/Profit markups). <strong>Overdue AR</strong> netted (invoice − cash/retainage). One row per active job; default shows only jobs needing invoicing or carrying overdue AR.</div>
    ${body}</div>`;
}

function sectionOverdueAR() {
  const rows = arRows('overdue', 'active').slice().sort((a, b) => (b.openBalance * b.daysOverdue) - (a.openBalance * a.daysOverdue));
  const total = rows.reduce((s, r) => s + r.openBalance, 0);
  const cap = 60, shown = rows.slice(0, cap);
  let body;
  if (!rows.length) {
    body = `<div class="billing-empty">${arData && !arData.error ? 'No overdue AR on active jobs.' : 'AR data unavailable.'}</div>`;
  } else {
    body = '<table class="billing-table"><thead><tr><th>Customer</th><th>Job</th><th>Pay app</th><th>Due</th><th class="r">Open balance</th><th class="r">Days overdue</th></tr></thead><tbody>';
    for (const r of shown) {
      const sev = r.daysOverdue > 60 ? ' over-60' : '';
      body += `<tr><td>${esc(r.customer || '—')}</td><td><span class="jno">${esc(r.jobNo || '')}</span> ${esc(r.jobName || '')}</td><td>${esc(r.payApp || '')}</td><td>${esc(r.dueDate || '')}</td><td class="r">${fmt(r.openBalance)}</td><td class="r${sev}">${r.daysOverdue}</td></tr>`;
    }
    body += '</tbody></table>';
    if (rows.length > cap) body += `<div class="billing-more">+ ${rows.length - cap} more overdue invoices</div>`;
  }
  return `<div class="billing-block">
    <h3 class="section-header">Overdue AR — active jobs <span class="big-num">${fmt(total)}</span> <span class="cnt">${rows.length} invoices</span></h3>
    <div class="billing-sub">Netted open balance (invoice − applied cash/discount/retainage), canonical ledger only, on active jobs. Provisional — retainage split + very-old items still being tuned.</div>
    ${body}</div>`;
}

// Real overdue AR on jobs Foundation marks closed — still cash owed, but not active work. Collapsed.
function sectionLegacyAR() {
  const rows = arRows('overdue', 'legacy').slice().sort((a, b) => (b.openBalance * b.daysOverdue) - (a.openBalance * a.daysOverdue));
  if (!rows.length) return '';
  const total = rows.reduce((s, r) => s + r.openBalance, 0);
  const cap = 40, shown = rows.slice(0, cap);
  let body = '<table class="billing-table"><thead><tr><th>Customer</th><th>Job</th><th>Pay app</th><th>Due</th><th class="r">Open balance</th><th class="r">Days overdue</th></tr></thead><tbody>';
  for (const r of shown) {
    const sev = r.daysOverdue > 60 ? ' over-60' : '';
    body += `<tr><td>${esc(r.customer || '—')}</td><td><span class="jno">${esc(r.jobNo || '')}</span> ${esc(r.jobName || '')}</td><td>${esc(r.payApp || '')}</td><td>${esc(r.dueDate || '')}</td><td class="r">${fmt(r.openBalance)}</td><td class="r${sev}">${r.daysOverdue}</td></tr>`;
  }
  body += '</tbody></table>';
  if (rows.length > cap) body += `<div class="billing-more">+ ${rows.length - cap} more</div>`;
  return `<details class="billing-details"><summary>Legacy / closed-job overdue AR — ${fmt(total)} · ${rows.length} invoices</summary>
    <div class="billing-sub">Overdue receivables on jobs Foundation marks closed (job_status ≠ A). Still real cash owed — kept separate from active work.</div>
    ${body}</details>`;
}

function sectionPhantom() {
  const rows = arRows('phantom').slice().sort((a, b) => b.invoiceAmount - a.invoiceAmount);
  const total = rows.reduce((s, r) => s + r.invoiceAmount, 0);
  const cap = 60, shown = rows.slice(0, cap);
  let body;
  if (!rows.length) {
    body = `<div class="billing-empty">${arData && !arData.error ? 'No phantom-open invoices.' : 'AR data unavailable.'}</div>`;
  } else {
    body = '<table class="billing-table"><thead><tr><th>Customer</th><th>Job</th><th>Invoice</th><th class="r">Invoice amount</th><th>Last cash</th></tr></thead><tbody>';
    for (const r of shown) body += `<tr><td>${esc(r.customer || '—')}</td><td><span class="jno">${esc(r.jobNo || '')}</span> ${esc(r.jobName || '')}</td><td>${esc(r.invoiceNo || '')}</td><td class="r">${fmt(r.invoiceAmount)}</td><td>${esc(r.lastCashDate || '')}</td></tr>`;
    body += '</tbody></table>';
    if (rows.length > cap) body += `<div class="billing-more">+ ${rows.length - cap} more</div>`;
  }
  return `<div class="billing-block">
    <h3 class="section-header">Data-integrity exceptions — paid but flagged open <span class="big-num">${fmt(total)}</span> <span class="cnt">${rows.length} invoices</span></h3>
    <div class="billing-sub">Paid to ~$0 (cash recorded in ar_history) but still flagged open in Foundation — the front-office cleanup queue, <strong>not</strong> real receivables.</div>
    ${body}</div>`;
}

// --- Stoplight filter state ---
let activeSLFilter = 'all';
function setSLFilter(val) {
  activeSLFilter = val;
  document.querySelectorAll('#sl-filter button').forEach(b => b.classList.toggle('active', b.dataset.sl === val));
  renderJobs();
}

// --- PM dropdown population ---
function populatePMFilter() {
  const sel = document.getElementById('filter-pm');
  if (!sel) return;
  const cur = sel.value;
  const pms = new Set();
  for (const j of (activeData?.jobs || [])) { const n = pmName(j); if (n) pms.add(n); }
  // sort the dropdown by first name ("First Last")
  sel.innerHTML = '<option value="">All PMs</option>' + [...pms].sort((a, b) => a.localeCompare(b)).map(n => `<option value="${esc(n)}">${esc(n)}</option>`).join('');
  if ([...pms].includes(cur)) sel.value = cur;
}

// --- Search, Filter & Sort ---
function getStoplightOrder(job) {
  const sl = getStoplight(job, job);
  return sl.color === 'red' ? 0 : sl.color === 'amber' ? 1 : sl.color === 'green' ? 2 : 3;
}

function filterAndSortJobs(jobs) {
  const query = (document.getElementById('job-search')?.value || '').toLowerCase().trim();
  const sortBy = document.getElementById('job-sort')?.value || 'stoplight';
  const stageFilter = document.getElementById('filter-stage')?.value || '';
  const clientFilter = document.getElementById('filter-client')?.value || '';
  const pmFilter = document.getElementById('filter-pm')?.value || '';

  let filtered = jobs;

  // Text search
  if (query) {
    filtered = filtered.filter(j => {
      const haystack = [j.name, j.client, pmName(j)].filter(Boolean).join(' ').toLowerCase();
      return haystack.includes(query);
    });
  }

  // Stoplight filter
  if (activeSLFilter !== 'all') {
    filtered = filtered.filter(j => {
      const c = getStoplight(j, j).color;
      if (activeSLFilter === 'atrisk') return c === 'red' || c === 'amber';
      return c === activeSLFilter;
    });
  }

  // Stage filter
  if (stageFilter) {
    if (stageFilter === 'closeout') {
      filtered = filtered.filter(j => CLOSEOUT_STAGES.has(j.stage));
    } else {
      filtered = filtered.filter(j => {
        const s = j.stage || ((!j.budget && (j.pctComplete == null || j.pctComplete === 0)) ? 'Pre-Construction' : null);
        return s === stageFilter;
      });
    }
  }

  // Client type filter
  if (clientFilter) {
    filtered = filtered.filter(j => j.clientType === clientFilter);
  }

  // PM filter
  if (pmFilter) {
    filtered = filtered.filter(j => pmName(j) === pmFilter);
  }

  // Sort
  filtered.sort((a, b) => {
    if (sortBy === 'stoplight') {
      const sa = getStoplightOrder(a), sb = getStoplightOrder(b);
      if (sa !== sb) return sa - sb;
      return (b.contractValue || 0) - (a.contractValue || 0);
    }
    if (sortBy === 'contract') return (b.contractValue || 0) - (a.contractValue || 0);
    if (sortBy === 'finish') {
      const fa = a.projectedFinish || a.completionDate || '9999', fb = b.projectedFinish || b.completionDate || '9999';
      return fa < fb ? -1 : fa > fb ? 1 : 0;
    }
    if (sortBy === 'pct') return (b.pctComplete || 0) - (a.pctComplete || 0);
    if (sortBy === 'pm') {
      const pa = pmName(a), pb = pmName(b);
      if (!pa && !pb) return 0;
      if (!pa) return 1; if (!pb) return -1;   // unassigned sorts to the bottom
      return pa.localeCompare(pb);             // "First Last" → alphabetical by first name
    }
    return 0;
  });

  return filtered;
}

// --- Jobs ---
function renderJobs() {
  const grid = document.getElementById('job-grid');
  let cards = [];
  if (currentView === 'active') {
    for (const job of filterAndSortJobs(getActiveJobs())) {
      cards.push(renderActiveCard(job, job));
    }
  } else if (currentView === 'closeout') {
    for (const job of filterAndSortJobs(getCloseoutJobs())) {
      cards.push(renderActiveCard(job, job));
    }
  } else if (currentView === 'completed') {
    for (const job of (portfolioData?.jobs || [])) {
      cards.push(renderCompletedCard(job));
    }
  }
  grid.innerHTML = cards.length ? cards.join('') : '<div style="color:var(--muted);padding:20px">No jobs to display</div>';
}

function renderActiveCard(job, live) {
  const contractVal = job.contractValue || live?.contractValue || (live?.budget?.revised || live?.budget?.original || 0);
  const pctComp = live?.pctComplete;
  const costOverrun = live?.costOverrun;
  const stage = live?.stage || null;
  const startDate = live?.start;
  const finishDate = live?.projectedFinish || live?.completionDate;
  const sl = getStoplight(job, live);

  // Schedule text — days remaining or overdue
  let schedText = '', schedClass = '';
  if (finishDate) {
    const diff = Math.round((new Date(finishDate) - new Date()) / (1000 * 60 * 60 * 24));
    if (diff < 0 && live?.verifyStatus) { schedText = 'Verify status in Procore'; schedClass = 'flag-amber'; }
    else if (diff < 0) { schedText = Math.abs(diff) + ' days overdue'; schedClass = 'flag-red'; }
    else { schedText = diff + ' days remaining'; schedClass = diff < 30 ? 'flag-amber' : ''; }
  }

  // Contracted margin
  const cMargin = contractedMargin(job);
  const mtd = marginToDate(job);
  let cMarginHtml = '', mtdHtml = '';
  if (cMargin != null) {
    cMarginHtml = `<span class="v ${cMargin === 0 ? 'margin-missing' : marginColorClass(cMargin)}">${pct(cMargin)}</span><br><span class="note">${cMargin === 0 ? 'Verify budget in Procore' : 'At signing'}</span>`;
    if (pctComp != null && pctComp >= 10 && mtd != null) {
      const arrow = mtd >= cMargin ? '<span style="color:var(--green)"> ↑</span>' : '<span style="color:var(--red)"> ↓</span>';
      mtdHtml = `<span class="v ${marginColorClass(mtd)}">${pct(mtd)}${arrow}</span><br><span class="note">vs ${pct(cMargin)} contracted</span>`;
    } else {
      mtdHtml = `<span class="v margin-missing">\u2014</span><br><span class="note">Available at 10% complete</span>`;
    }
  } else {
    cMarginHtml = `<span class="v margin-missing">\u2014</span><br><span class="note">No budget in Procore</span>`;
    mtdHtml = `<span class="v margin-missing">\u2014</span>`;
  }

  // % Complete display
  let pctDisp = '\u2014', pctNote = '';
  if (pctComp != null) {
    pctDisp = pct(pctComp);
    if (pctComp > 100) pctDisp = `<span class="flag-red">${pct(pctComp)}</span><br><span class="note">Over contract</span>`;
  } else {
    pctNote = '<br><span class="note">Not set in Procore</span>';
  }

  // Change orders
  const co = live?.changeOrders;
  const coVal = co?.netValue || 0;
  const coExceedsThreshold = contractVal > 0 && Math.abs(coVal) > contractVal * 0.05;

  // Pre-construction pending state
  const isPreconPending = !job.budget && (pctComp == null || pctComp === 0);
  const stageDisplay = stage || (isPreconPending ? 'Pre-Construction' : null);

  return `
    <div class="job-card sl-${sl.color}">
      <div class="job-header">
        <div>
          <div class="job-name"><span class="stoplight stoplight-${sl.color}"></span>${esc(job.name)}</div>
          <div class="job-client">${esc(job.client)}</div>
          ${renderPeopleLine(job)}
        </div>
        <div class="badges">
          ${stageDisplay ? `<span class="badge badge-stage">${esc(stageDisplay)}</span>${stageDisplay === 'Pre-Construction' && pctComp > 20 ? '<span class="stage-warn" style="color:var(--amber)">⚠<span class="tooltip">Stage may need updating in Procore</span></span>' : ''}` : '<span class="badge badge-stage-null">Stage not set</span>'}
          <span class="badge badge-${job.clientType}">${typeName(job.clientType)}</span>
        </div>
      </div>
      <div class="job-stats${isPreconPending ? ' precon-pending' : ''}">
        <div class="job-stat"><span class="k">Contract</span><span class="v">${fmtCompact(contractVal)}</span>${(job.flags || []).some(f => f.type === 'contract') ? `<br><span class="contract-flag">⚑ Procore ${fmtCompact(job.procoreContractValue)}</span>` : ''}</div>
        <div class="job-stat"><span class="k">% complete</span><span class="v">${pctDisp}${pctNote}</span></div>
        <div class="job-stat"><span class="k">Contracted margin</span>${cMarginHtml}</div>
        <div class="job-stat"><span class="k">Margin to date</span>${mtdHtml}</div>
        <div class="job-stat"><span class="k">Change orders</span><span class="v${coExceedsThreshold ? ' flag-amber' : ''}">${fmtCO(co)}</span></div>
        <div class="job-stat"><span class="v">${fmtShort(startDate)} → ${fmtShort(finishDate)}</span><br><span class="${schedClass}">${schedText}</span></div>
        ${isPreconPending ? '<div class="precon-note">Financial data will appear once contract is entered in Procore.</div>' : ''}
      </div>
      ${sl.reasons?.length ? `<div class="sl-reason sl-reason-${sl.color}">${sl.reasons.map(r => r.text).join(' · ')}</div>` : ''}
      ${renderFoundationLine(job)}
      ${renderCustomerSuccess(job)}
    </div>`;
}

// Customer Success block — Jake's owner visits (kickoff / quarterly progress / closeout),
// open issues, and opportunities, sourced live from Buildr via /api/ryc-buildr and keyed by
// project number. Collapsed by default; click to expand the visit log. Buildr is the system
// of record (entry happens there); this is the read-only leadership view.
function renderCustomerSuccess(job) {
  if (!buildrData || !buildrData.jobs) return '';
  const rec = buildrData.jobs[job.projectNumber];
  // No record: nudge adoption on active jobs only; stay silent on closeout/other.
  if (!rec || (!rec.meetings.length && !rec.openTasks.length && !rec.opportunities.length)) {
    return `<div class="cs-block cs-empty"><span class="cs-tag">🤝 Customer Success</span> <span class="cs-none">No owner visits logged in Buildr yet</span></div>`;
  }
  const chip = (label, on, n) =>
    `<span class="cs-chip ${on ? 'cs-on' : 'cs-off'}">${label}${n != null && n > 0 ? ' ×' + n : (on ? ' ✓' : ' –')}</span>`;
  const c = rec.counts || {};
  const last = rec.daysSinceLastMeeting;
  const lastTxt = last == null ? 'no visits' : last === 0 ? 'today' : last + 'd ago';
  const issues = rec.openTasks.length, opps = rec.opportunities.length;
  const attn = rec.needsAttention ? ' cs-attn' : '';

  const mtgRows = rec.meetings.map(m => `
    <div class="cs-row">
      <span class="cs-mtype cs-${m.type}">${m.type}</span>
      <span class="cs-date">${fmtShort(m.at)}</span>
      <div class="cs-body"><div class="cs-title">${esc(m.title || '')}</div>${m.notes ? `<div class="cs-notes">${esc(m.notes).slice(0, 600)}</div>` : ''}</div>
    </div>`).join('');
  const issueRows = issues ? `<div class="cs-sub">Open issues / follow-ups</div>` + rec.openTasks.map(t =>
    `<div class="cs-row cs-issue"><span class="cs-flag">${t.issue ? '⚑' : '•'}</span><div class="cs-body"><div class="cs-title">${esc(t.title || '')}</div><div class="cs-meta">${esc(t.assignedTo || 'unassigned')}${t.deadline ? ' · due ' + esc(t.deadline) : ''}</div></div></div>`).join('') : '';
  const oppRows = opps ? `<div class="cs-sub">Opportunities identified</div>` + rec.opportunities.map(o =>
    `<div class="cs-row cs-opp"><span class="cs-flag">★</span><div class="cs-body"><div class="cs-title">${esc(o.title || '')}</div>${o.notes ? `<div class="cs-notes">${esc(o.notes).slice(0, 400)}</div>` : ''}</div></div>`).join('') : '';

  return `
    <details class="cs-block${attn}">
      <summary>
        <span class="cs-tag">🤝 Customer Success</span>
        ${chip('Kickoff', c.kickoff > 0)}
        ${chip('Progress', c.progress > 0, c.progress)}
        ${chip('Closeout', c.closeout > 0)}
        <span class="cs-summary-meta">last visit ${lastTxt}${issues ? ` · <span class="cs-i">${issues} open</span>` : ''}${opps ? ` · <span class="cs-o">${opps} opp${opps > 1 ? 's' : ''}</span>` : ''}</span>
      </summary>
      <div class="cs-detail">${mtgRows || '<div class="cs-none">No visits logged yet</div>'}${issueRows}${oppRows}</div>
    </details>`;
}

function renderCompletedCard(job) {
  const margin = getBestMargin(job);
  const overrun = job.scheduleOverrunMonths;
  const sources = [];
  if (job.dataQuality) sources.push('<span class="badge badge-sp">SP</span>');
  if (job.procoreId) sources.push('<span class="badge badge-procore">Procore</span>');

  return `
    <div class="job-card">
      <div class="job-header">
        <div><div class="job-name">${esc(job.name)}</div><div class="job-client">${esc(job.client)}</div></div>
        <div class="badges">
          <span class="badge badge-completed">Completed</span>
          <span class="badge badge-${job.clientType}">${typeName(job.clientType)}</span>
          ${sources.join('')}
        </div>
      </div>
      <div class="job-stats">
        <div class="job-stat"><span class="k">Contract</span><span class="v">${fmt(job.contractFinal)}</span></div>
        <div class="job-stat"><span class="k">CO %</span><span class="v">${job.coPct != null ? pct(job.coPct) : '\u2014'}</span></div>
        <div class="job-stat"><span class="k">Margin</span><span class="v ${marginClass(margin)} ${dqClass(job.dataQuality?.margin)}">${margin != null ? pct(margin) : 'Missing'}</span></div>
        <div class="job-stat"><span class="k">Schedule</span><span class="v${overrun > 6 ? ' flag-red' : overrun > 2 ? ' flag-amber' : ''}">${overrun != null ? '+' + overrun + ' mo' : '\u2014'}</span></div>
        <div class="job-stat"><span class="k">RFIs</span><span class="v">${job.rfis ?? '\u2014'}</span></div>
        <div class="job-stat"><span class="k">Submittals</span><span class="v">${job.submittals ?? '\u2014'}</span></div>
        <div class="job-stat"><span class="k">Change events</span><span class="v">${job.changeEvents ?? '\u2014'}</span></div>
        <div class="job-stat"><span class="k">Completed</span><span class="v">${fmtShort(job.actualCompletion)}</span></div>
      </div>
    </div>`;
}
