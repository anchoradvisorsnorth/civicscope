<!DOCTYPE html>
<!-- civicscope-village v2.0.0 | 2026-08-25 — a village's front door, behind Google sign-in -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Village Hub — CivicScope</title>
<meta name="description" content="The Village's CivicScope tools in one place.">
<meta name="robots" content="noindex">
<link rel="stylesheet" href="/civicscope.css">
<style>
  /* Layout only — every colour and typeface comes from civicscope.css tokens.
     Built for one reader: the village manager, often on a tablet, often standing up. */
  body { background: var(--cream); color: var(--ink); font-family: var(--font-body); }
  .wrap { max-width: 720px; margin: 0 auto; padding: 56px 24px 80px; }

  header.masthead { margin-bottom: 40px; }
  .eyebrow { font-size: 12px; letter-spacing: .14em; text-transform: uppercase;
             color: var(--muted); margin-bottom: 12px; }
  h1 { font-family: var(--font-display); font-weight: 600;
       font-size: clamp(30px, 6vw, 44px); line-height: 1.12; margin: 0 0 12px; }
  .sub { color: var(--ink-light); font-size: 17px; line-height: 1.55; margin: 0; }
  .sub a { color: var(--accent); }

  /* Product cards — the whole point of the page */
  .cards { display: grid; gap: 16px; margin: 8px 0 0; }
  a.card {
    display: block; text-decoration: none; color: inherit;
    background: var(--white); border: 1px solid var(--rule); border-radius: var(--radius-md);
    padding: 26px 28px; box-shadow: var(--shadow-sm);
    transition: border-color var(--ease), box-shadow var(--ease), transform var(--ease);
  }
  a.card:hover { border-color: var(--accent); box-shadow: var(--shadow-md); transform: translateY(-1px); }
  .card .row { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; }
  .card h2 { font-family: var(--font-display); font-size: 22px; font-weight: 600; margin: 0 0 8px; }
  .card p { font-size: 15px; line-height: 1.6; color: var(--ink-light); margin: 0 0 14px; }
  .card .meta { font-size: 13px; color: var(--muted); }
  .card .go { font-size: 14px; font-weight: 600; color: var(--accent); white-space: nowrap; }

  /* Sign-in */
  .gate { background: var(--white); border: 1px solid var(--rule); border-radius: var(--radius-md);
          padding: 30px 28px; box-shadow: var(--shadow-sm); }
  .gate h2 { font-family: var(--font-display); font-size: 21px; font-weight: 600; margin: 0 0 10px; }
  .gate p { font-size: 15px; line-height: 1.6; color: var(--ink-light); margin: 0 0 20px; }
  .gbtn { min-height: 44px; }
  .who { display: flex; align-items: center; gap: 10px; justify-content: flex-end;
         font-size: 13.5px; color: var(--muted); margin-bottom: 18px; flex-wrap: wrap; }
  .who img { width: 26px; height: 26px; border-radius: 50%; }
  .who b { color: var(--ink-light); font-weight: 600; }
  .who button { background: none; border: 0; color: var(--muted); font: inherit;
                text-decoration: underline; cursor: pointer; padding: 0; }
  .who button:hover { color: var(--accent); }

  .notice { border: 1px dashed var(--rule); border-radius: var(--radius-md);
            padding: 16px 18px; font-size: 13.5px; line-height: 1.55; color: var(--muted);
            margin-top: 24px; }

  footer.foot { margin-top: 44px; padding-top: 20px; border-top: 1px solid var(--rule);
                font-size: 13px; line-height: 1.6; color: var(--muted); }
  footer.foot a { color: var(--muted); text-decoration: underline; }

  .status { color: var(--muted); font-size: 15px; }
  .err { background: #fef2f2; border-left: 2px solid #dc2626; padding: 13px 16px;
         font-size: 14px; color: var(--ink-light); border-radius: 0 var(--radius-sm) var(--radius-sm) 0; }
  .pending { background: #fffbeb; border-left: 2px solid #d97706; padding: 13px 16px;
             font-size: 14px; color: var(--ink-light); border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
             margin-bottom: 18px; line-height: 1.55; }

  @media (max-width: 620px) {
    .wrap { padding: 36px 18px 56px; }
    a.card { padding: 22px 20px; }
    .card .row { flex-direction: column; gap: 6px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="who" id="who" hidden></div>

  <header class="masthead">
    <div class="eyebrow">CivicScope</div>
    <h1 id="title">Loading…</h1>
    <p class="sub" id="sub"></p>
  </header>

  <div id="main"></div>

  <footer class="foot" id="foot"></footer>

</div>

<script>
/* ============================================================================================
   THE HUB IS THE GATE (Keith, 2026-08-25: "this is the page that should be gated with login for
   Michelle and her assistant").

   Signing in belongs HERE rather than on each product, for the reason the hub exists at all:
   Michelle is one person holding two jobs — she runs the village office and she is the
   Operator-In-Charge of the water plant — so one address, one sign-in, and the page routes her.
   Sheila Nelson, her assistant, is enrolled the same way. The session cookie is scoped to
   `.civicscope.io`, so following a card into Well Testing on `app.civicscope.io` does not ask
   again; being sent back to sign in a second time is exactly the friction that sends people back
   to paper.

   ⛔ THE CREW ARE NOT PART OF THIS AND MUST NEVER BE. Mark Major and Jeff Derrikson walk the round
   with a tablet at /water and, in Keith's words, "wont have email logins". That surface stays open
   and asks only for a name. This gate is the office, not the well house.

   ⚠ WHEN SIGN-IN IS NOT CONFIGURED, THE PAGE OPENS RATHER THAN BRICKS. `configured:false` means
   this deployment has no Google client id yet. Refusing everyone in that state would take a working
   tool away from the village to enforce a gate that nobody — including the people it is for — could
   satisfy. So it says so plainly and lets them through, and the moment the client id is set the
   gate is live with no code change. An honest sentence beats both a dead button and a locked door.
   ============================================================================================ */
const SLUG = (location.pathname.replace(/^\/+|\/+$/g, '').split('/')[0] || '').toLowerCase();

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
  .replace(/"/g, '&quot;').replace(/'/g, '&#39;');

const auth = async (action, extra = {}) => {
  const r = await fetch('/api/auth-google', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ action, ...extra }),
  });
  return r.json().catch(() => ({ ok: false, error: 'bad response' }));
};

function fail(msg) { $('main').innerHTML = '<div class="err">' + esc(msg) + '</div>'; }

/** One product card. `meta` is the honest one-line state of that product today. */
function card(href, name, blurb, meta) {
  return '<a class="card" href="' + esc(href) + '">'
    + '<div class="row"><h2>' + esc(name) + '</h2><span class="go">Open →</span></div>'
    + '<p>' + blurb + '</p>'
    + '<div class="meta">' + meta + '</div>'
    + '</a>';
}

let TENANT = null, CORPUS = null;

async function loadTenant() {
  const r = await fetch('/api/muni-ask?tenant=' + encodeURIComponent(SLUG));
  const d = await r.json();
  if (!r.ok) throw new Error(d.error || 'Could not load this village.');
  TENANT = d.tenant; CORPUS = d.corpus || {};
  const short = TENANT.short_label || TENANT.label;
  document.title = short + ' — CivicScope';
  $('title').textContent = short;
  $('sub').innerHTML = 'Your CivicScope tools, in one place.'
    + (TENANT.site_url ? ' <a href="' + esc(TENANT.site_url) + '" target="_blank" rel="noopener">Village website ↗</a>' : '');
  $('foot').innerHTML = 'CivicScope builds these from the Village’s own records. '
    + 'Answers and reports are working tools, not legal advice or a filed submission — '
    + 'check anything that matters against the source document.';
}

/** The tools this person may actually open. Entitlement is data on their row, never a guess. */
function renderCards(user, opts) {
  const openBecauseUnconfigured = Boolean(opts && opts.openBecauseUnconfigured);
  const short = TENANT.short_label || TENANT.label;
  const cards = [];

  // ── Ask <Village> ────────────────────────────────────────────────────────────────────
  // Named for the village because that is what it is — the village's own documents, not a
  // general legal search. Only offered when the corpus is actually answering.
  if (TENANT.active) {
    cards.push(card(
      '/' + SLUG + '/ask',
      'Ask ' + short,
      'Ask a question in plain English and get an answer drawn from the Village’s own ordinances '
        + 'and zoning rules — with a link to the source document every time.',
      '<strong>' + (CORPUS.documents || 0) + '</strong> documents indexed'
        + (CORPUS.passages ? ' · ' + CORPUS.passages.toLocaleString() + ' searchable passages' : '')
        + (CORPUS.transcribed ? ' · ' + CORPUS.transcribed + ' transcribed from scans' : '')
    ));
  }

  // ── Well Testing ─────────────────────────────────────────────────────────────────────
  // Shown when this village has a supply on the platform (muni_tenants.water_wssn) AND this
  // person is enrolled for it. Sheila is enrolled for the plant too — Keith, 2026-08-25:
  // "the assistant wont go into the well page - but she can have access" — so what decides the
  // card is her row, not our assumption about her job.
  const entitled = openBecauseUnconfigured
    || (user && (user.role === 'admin' || user.water_wssn === TENANT.water_wssn));
  if (TENANT.water_wssn && entitled) {
    cards.push(card(
      // The hub is the office's front door, so it opens on the REVIEW side. The crew never come
      // through here — they bookmark /water and go straight to entering a round.
      '/water/review?wssn=' + encodeURIComponent(TENANT.water_wssn),
      'Well Testing',
      'Review the daily round at the plant — wells, doses, tank levels and distribution samples — '
        + 'and generate the monthly EGLE report from what was actually recorded.',
      // ⚠ This line used to read "needs your plant access code". There has never been a plant
      // access code for anyone to hold (Keith, 2026-08-21), so the hub was sending its one reader
      // off to find a credential that does not exist. Sign-in replaced it.
      'Water supply <strong>WSSN ' + esc(TENANT.water_wssn) + '</strong>'
        + ' · the MOR is due to EGLE by the 10th'
    ));
  }

  if (!cards.length) {
    fail('No tools are switched on for your account for this village yet.');
    return;
  }
  $('main').innerHTML = '<div class="cards">' + cards.join('') + '</div>'
    + (openBecauseUnconfigured
        ? '<div class="notice"><strong>Sign-in is not switched on for this deployment yet.</strong> '
          + 'Anyone with this link can open these tools until it is. Nothing here is hidden behind a '
          + 'control that does not work.</div>'
        : '');
}

/** Signed out, and sign-in works. This is the whole page. */
function renderGate(clientId, pendingMsg) {
  const short = (TENANT && (TENANT.short_label || TENANT.label)) || 'this village';
  $('main').innerHTML =
    (pendingMsg ? '<div class="pending">' + esc(pendingMsg) + '</div>' : '')
    + '<div class="gate">'
    + '<h2>Sign in to continue</h2>'
    + '<p>These are ' + esc(short) + '’s own records. Sign in with the Google account the Village '
    + 'has on file for you.</p>'
    + '<div class="gbtn" id="gbtn"></div>'
    + '</div>'
    + '<div class="notice">Taking readings at the plant? The well-house app does not need a sign-in — '
    + 'open <strong>civicscope.io/water</strong> on the tablet and pick your name.</div>';

  const s = document.createElement('script');
  s.src = 'https://accounts.google.com/gsi/client';
  s.async = true; s.defer = true;
  s.onload = () => {
    google.accounts.id.initialize({ client_id: clientId, callback: onCredential });
    google.accounts.id.renderButton($('gbtn'), {
      theme: 'outline', size: 'large', text: 'signin_with', shape: 'pill', width: 280,
    });
  };
  // A blocked or failed GIS script must not leave an empty box that reads as a slow page.
  s.onerror = () => {
    $('gbtn').innerHTML = '<div class="err">Google sign-in could not load. '
      + 'Check that this browser is not blocking accounts.google.com.</div>';
  };
  document.head.appendChild(s);
}

async function onCredential(response) {
  $('gbtn').innerHTML = '<div class="status">Signing in…</div>';
  const r = await auth('signin', { credential: response.credential });
  if (r.signedIn) { boot(); return; }
  // Verified by Google, not enrolled here. Say exactly which address was used — that is the one
  // fact that turns fixing it into a single step instead of a conversation.
  boot(r.msg || r.error || 'That sign-in could not be completed.');
}

function renderWho(user) {
  $('who').hidden = false;
  $('who').innerHTML =
    (user.picture ? '<img src="' + esc(user.picture) + '" alt="">' : '')
    + '<span>Signed in as <b>' + esc(user.name || user.email) + '</b></span>'
    + '<button type="button" id="out">Sign out</button>';
  $('out').onclick = async () => {
    await auth('signout');
    if (window.google && google.accounts && google.accounts.id) google.accounts.id.disableAutoSelect();
    boot();
  };
}

async function boot(pendingMsg) {
  if (!SLUG) { fail('No village specified in the address.'); return; }
  $('main').innerHTML = '<div class="status">Loading…</div>';
  $('who').hidden = true;

  try { await loadTenant(); } catch (e) { fail(e.message); return; }

  let me;
  try { me = await auth('me'); } catch { fail('Could not reach CivicScope. Please try again.'); return; }

  if (me.signedIn) { renderWho(me.user); renderCards(me.user); return; }
  if (me.configured && me.client_id) { renderGate(me.client_id, pendingMsg); return; }
  renderCards(null, { openBecauseUnconfigured: true });
}

boot();
</script>
</body>
</html>
