<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RYC Command Center</title>
<link rel="icon" href="/ryc-dashboard/RYC_Shield_Orange.png">
<style>
/* ===== RYC Command Center — design tokens ==================================== */
:root{
  --font-sans:-apple-system,"Segoe UI",system-ui,Roboto,Helvetica,Arial,sans-serif;
  --font-serif:"Newsreader","Iowan Old Style",Georgia,"Times New Roman",serif;
  --bg:#0a0e1a; --sidebar:#0c1322; --panel:#111a2e; --panel-2:#0e1626;
  --border:#1e2942; --border-soft:#182238;
  --text:#e8ecf4; --muted:#8b97ad; --faint:#5c6884;
  --accent:#f26a1b; --accent-soft:rgba(242,106,27,.13); --accent-line:rgba(242,106,27,.5);
  --green:#2fbf71; --amber:#f2a33c; --red:#ef5350; --blue:#5b9bd5;
  --r:11px; --r-sm:7px; --grid:rgba(255,255,255,.022);
  --shadow:0 12px 40px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--font-sans);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
#gate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(1200px 700px at 50% -10%,#12203a 0%,var(--bg) 60%);z-index:50}
#gate .card{background:var(--panel);border:1px solid var(--border);border-radius:var(--r);padding:34px 32px;width:340px;text-align:center;box-shadow:var(--shadow)}
#gate img{width:52px;height:52px;margin-bottom:14px}
#gate h1{font-family:var(--font-serif);font-weight:600;font-size:22px;margin:0 0 4px}
#gate p{color:var(--muted);font-size:13px;margin:0 0 20px}
#gate input{width:100%;padding:11px 13px;background:var(--panel-2);border:1px solid var(--border);border-radius:var(--r-sm);color:var(--text);font-size:15px;text-align:center;letter-spacing:.5px}
#gate input:focus{outline:none;border-color:var(--accent-line)}
#gate button{width:100%;margin-top:12px;padding:11px;background:var(--accent);color:#fff;border:none;border-radius:var(--r-sm);font-size:14px;font-weight:600;cursor:pointer}
#gate .err{color:var(--red);font-size:12px;height:14px;margin-top:8px}
#app[hidden]{display:none}
.shell{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
.sidebar{background:var(--sidebar);border-right:1px solid var(--border-soft);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:11px;padding:20px 18px 18px}
.brand img{width:34px;height:34px}
.brand .bt{font-weight:700;font-size:15px;letter-spacing:.2px}
.brand .bs{color:var(--muted);font-size:11px;margin-top:1px}
.nav{padding:6px 12px;display:flex;flex-direction:column;gap:2px;flex:1;overflow-y:auto}
.nav button{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:var(--r-sm);color:var(--muted);font-size:13.5px;font-weight:500;border:none;border-left:2px solid transparent;cursor:pointer;background:none;width:100%;text-align:left;font-family:inherit}
.nav button .ic{width:18px;text-align:center;font-size:14px;opacity:.9}
.nav button:hover{background:var(--panel-2);color:var(--text)}
.nav button:focus-visible{outline:2px solid var(--accent-line);outline-offset:-2px}
.nav button.active{background:var(--accent-soft);color:var(--text);border-left-color:var(--accent)}
.side-foot{padding:12px 14px;border-top:1px solid var(--border-soft);font-size:12px}
.side-foot a{color:var(--muted);text-decoration:none;display:block;padding:5px 0}
.side-foot a:hover{color:var(--accent)}
.side-foot .ver{color:var(--faint);font-size:11px;margin-top:8px}
.content{position:relative;background:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:34px 34px;min-height:100vh;min-width:0}
.topbar{display:flex;align-items:flex-end;justify-content:space-between;padding:26px 34px 18px;border-bottom:1px solid var(--border-soft)}
.topbar h2{font-family:var(--font-serif);font-weight:600;font-size:26px;margin:0}
.topbar .ctx{color:var(--muted);font-size:12.5px;margin-top:4px}
.view{padding:24px 34px 60px}
.kpi-strip{display:grid;grid-template-columns:repeat(5,1fr);background:var(--panel);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;margin-bottom:22px}
.kpi{padding:15px 18px;border-right:1px solid var(--border-soft)}
.kpi:last-child{border-right:none}
.kpi .kl{color:var(--muted);font-size:10.5px;letter-spacing:.7px;text-transform:uppercase}
.kpi .kv{font-family:var(--font-serif);font-size:23px;margin-top:5px;font-variant-numeric:tabular-nums}
.kpi .kv.accent{color:var(--accent)} .kpi .kv.warn{color:var(--amber)} .kpi .kv.bad{color:var(--red)}
.kpi .ks{color:var(--faint);font-size:11px;margin-top:2px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:2px 9px;border-radius:20px}
.pill.g{background:rgba(47,191,113,.14);color:var(--green)} .pill.a{background:rgba(242,163,60,.15);color:var(--amber)} .pill.r{background:rgba(239,83,80,.15);color:var(--red)}
.pill.dot::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;display:inline-block}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:var(--r);padding:18px 20px;margin-bottom:18px}
.panel h3{font-family:var(--font-serif);font-weight:600;font-size:16px;margin:0 0 3px}
.panel .sub{color:var(--muted);font-size:12.5px;margin-bottom:14px}
/* priority queue */
.qsec{margin-bottom:16px}
.qsec .qh{display:flex;align-items:center;gap:9px;font-size:12px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--muted);margin:0 2px 8px}
.qsec .qh .qn{background:var(--panel-2);border:1px solid var(--border-soft);border-radius:20px;padding:0 8px;font-size:11px;color:var(--text)}
.q-row{display:flex;align-items:center;gap:13px;padding:10px 14px;border:1px solid var(--border-soft);border-left:3px solid var(--border);border-radius:var(--r-sm);background:var(--panel-2);margin-bottom:7px}
.q-row.red{border-left-color:var(--red)} .q-row.amber{border-left-color:var(--amber)} .q-row.info{border-left-color:var(--blue)} .q-row.fade{border-left-color:#c07adf} .q-row.closeout{border-left-color:#64d2c3} .q-row.conflict{border-left-color:#e0c060}
.q-job{font-weight:600;font-size:13.5px;min-width:210px;max-width:210px}
.q-job .q-jno{color:var(--faint);font-size:11px;font-weight:500;display:block}
.q-detail{color:var(--muted);font-size:12.5px;flex:1}
.q-detail b{color:var(--text);font-weight:600}
.q-val{font-family:var(--font-serif);font-size:15px;font-variant-numeric:tabular-nums;text-align:right;min-width:78px}
.q-val.bad{color:var(--red)} .q-val.warn{color:var(--amber)}
.q-empty{color:var(--faint);font-size:12.5px;padding:4px 2px}
.src-strip{display:flex;flex-wrap:wrap;gap:8px;margin-top:2px}
.src-chip{display:flex;align-items:center;gap:7px;background:var(--panel-2);border:1px solid var(--border-soft);border-radius:20px;padding:5px 12px;font-size:11.5px;color:var(--muted)}
.src-chip b{color:var(--text);font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
/* ===== light operator theme (Portfolio / Billing / Margin / work views) ======= */
.content.light{background:#eef1f5;background-image:none;color:#1c2433}
.light .topbar{border-bottom-color:#dde3ec}
.light .topbar .ctx{color:#67718a}
.light .panel{background:#fff;border-color:#dfe4ec;color:#1c2433}
.light .panel .sub{color:#67718a}
/* portfolio table */
.pbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:14px}
.pbar input{padding:8px 12px;border:1px solid #d5dbe6;border-radius:var(--r-sm);font-size:13px;width:240px;background:#fff;color:#1c2433}
.pbar input:focus{outline:2px solid var(--accent-line)}
.pfill{border:1px solid #d5dbe6;background:#fff;color:#4a5670;border-radius:20px;padding:5px 13px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit}
.pfill:hover{border-color:var(--accent)}
.pfill.on{background:var(--accent);border-color:var(--accent);color:#fff}
.pbar .pcount{margin-left:auto;color:#67718a;font-size:12px}
.ptable-wrap{background:#fff;border:1px solid #dfe4ec;border-radius:var(--r);overflow:auto;box-shadow:0 1px 3px rgba(20,30,55,.06)}
table.ptable{width:100%;border-collapse:collapse;font-size:12.5px}
.ptable th{position:sticky;top:0;background:#f7f9fc;color:#5b6578;font-size:10.5px;letter-spacing:.6px;text-transform:uppercase;text-align:left;padding:9px 10px;border-bottom:1px solid #e2e7ef;cursor:pointer;white-space:nowrap;user-select:none;z-index:1}
.ptable th.r,.ptable td.r{text-align:right}
.ptable th .arr{color:var(--accent)}
.ptable td{padding:8px 10px;border-top:1px solid #eef1f6;white-space:nowrap;font-variant-numeric:tabular-nums;color:#26304a}
.ptable tbody tr:hover{background:#f6f8fb}
.ptable .jname{font-weight:600;max-width:250px;overflow:hidden;text-overflow:ellipsis}
.ptable .jno{color:#8b95ab;font-size:11px}
.ptable tfoot td{background:#f7f9fc;font-weight:700;border-top:2px solid #dfe4ec}
.m-g{color:#1d9e63;font-weight:600}.m-a{color:#c07f1a;font-weight:600}.m-r{color:#d64545;font-weight:600}.m-m{color:#9aa3b5}
.conf{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:700;border-radius:4px;padding:1px 6px}
.conf.ok{background:rgba(29,158,99,.12);color:#1d9e63}.conf.mid{background:rgba(192,127,26,.13);color:#c07f1a}.conf.low{background:rgba(214,69,69,.12);color:#d64545}
.cell-sub{color:#8b95ab;font-size:10.5px}
.warn-banner{background:rgba(239,83,80,.12);border:1px solid rgba(239,83,80,.4);color:#ffd9d7;border-radius:var(--r-sm);padding:11px 15px;font-size:13px;margin-bottom:18px}
.warn-banner b{color:#fff}
.q-more{font-size:11px;color:var(--faint);font-weight:500;text-transform:none;letter-spacing:0;margin-left:6px}
/* ===== job detail drawer (Phase 3a) ========================================== */
.ptable tbody tr{cursor:pointer}
.ptable tbody tr:focus-visible{outline:2px solid var(--accent-line);outline-offset:-2px}
.dw-overlay{position:fixed;inset:0;background:rgba(10,14,26,.45);z-index:30}
.drawer{position:fixed;top:0;right:0;bottom:0;width:580px;max-width:96vw;background:#fff;color:#1c2433;box-shadow:-18px 0 50px rgba(10,15,30,.28);z-index:31;display:flex;flex-direction:column;border-left:1px solid #dfe4ec}
.dw-head{padding:18px 22px 14px;border-bottom:1px solid #e4e9f1;display:flex;align-items:flex-start;gap:12px}
.dw-head h3{font-family:var(--font-serif);font-size:19px;font-weight:600;margin:0;color:#1c2433}
.dw-head .dw-sub{color:#67718a;font-size:12px;margin-top:3px;line-height:1.5}
.dw-close{margin-left:auto;flex-shrink:0;background:none;border:1px solid #d5dbe6;border-radius:6px;color:#4a5670;font-size:16px;width:30px;height:30px;cursor:pointer;line-height:1;font-family:inherit}
.dw-close:hover{border-color:var(--accent);color:var(--accent)}
.dw-body{overflow-y:auto;padding:16px 22px 44px;flex:1}
.dw-sec{margin-bottom:22px}
.dw-sec h4{font-size:10.5px;letter-spacing:.7px;text-transform:uppercase;color:#5b6578;margin:0 0 8px}
.dw-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.dw-stat{background:#f7f9fc;border:1px solid #e4e9f1;border-radius:7px;padding:9px 11px;min-width:0}
.dw-stat .l{color:#67718a;font-size:10px;text-transform:uppercase;letter-spacing:.5px;white-space:nowrap}
.dw-stat .v{font-family:var(--font-serif);font-size:16.5px;margin-top:3px;font-variant-numeric:tabular-nums}
.dw-stat .s{color:#8b95ab;font-size:10.5px;margin-top:1px}
table.dwt{width:100%;border-collapse:collapse;font-size:12px}
.dwt th{text-align:left;color:#5b6578;font-size:10px;letter-spacing:.5px;text-transform:uppercase;padding:5px 8px;border-bottom:1px solid #e2e7ef;white-space:nowrap;font-weight:600}
.dwt td{padding:6px 8px;border-top:1px solid #eef1f6;font-variant-numeric:tabular-nums;color:#26304a}
.dwt th.r,.dwt td.r{text-align:right}
.dwt td.ok{color:#1d9e63;font-weight:600}.dwt td.dv{color:#c07f1a;font-weight:600}
.dw-note{color:#8b95ab;font-size:11px;margin-top:6px;line-height:1.5}
.dw-reason{background:#fdf3ea;border:1px solid #f0d5bc;border-radius:7px;padding:8px 12px;font-size:12.5px;color:#8a4b12;margin-top:10px}
.dw-chip{display:inline-block;background:#f1f4f9;border:1px solid #e2e7ef;border-radius:12px;padding:2px 9px;font-size:11px;color:#4a5670;margin:0 4px 4px 0}
@media(max-width:760px){.drawer{width:100vw}}
@media(max-width:980px){.grid2{grid-template-columns:1fr}.kpi-strip{grid-template-columns:repeat(2,1fr)}}
@media(max-width:760px){
  .shell{grid-template-columns:1fr}
  .sidebar{position:static;height:auto}
  .nav{flex-direction:row;flex-wrap:wrap;gap:4px}
  .nav button{width:auto}
  .topbar{padding:18px 18px 14px}.topbar h2{font-size:22px}
  .view{padding:16px 16px 50px}
  .kpi-strip{grid-template-columns:1fr 1fr}
  .kpi{border-bottom:1px solid var(--border-soft)}
  .q-row{flex-wrap:wrap;gap:6px 12px}
  .q-job{min-width:0;max-width:none;flex:1 1 100%}
  .q-val{min-width:0;text-align:left}
}
</style>
</head>
<body>

<div id="gate">
  <div class="card">
    <img src="/ryc-dashboard/RYC_Shield_Orange.png" alt="RYC">
    <h1>Command Center</h1>
    <p>R. Yoder Construction</p>
    <input id="gate-input" type="password" placeholder="Access code" autocomplete="off">
    <div class="err" id="gate-err"></div>
    <button id="gate-btn">Enter</button>
  </div>
</div>

<div id="app" hidden>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand">
        <img src="/ryc-dashboard/RYC_Shield_Orange.png" alt="RYC">
        <div><div class="bt">R. Yoder</div><div class="bs">Command Center</div></div>
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="side-foot">
        <a href="/ryc/estimate">&#128208; Estimating Tools &rarr;</a>
        <a href="/ryc/dashboard">&#11116; Legacy Dashboard</a>
        <div class="ver">v2.4.0-command &middot; Phase 3a</div>
      </div>
    </aside>
    <main class="content">
      <div class="topbar">
        <div><h2 id="view-title">Command Center</h2><div class="ctx" id="view-ctx">Loading&hellip;</div></div>
      </div>
      <div class="view" id="view"></div>
    </main>
  </div>
</div>

<script>
"use strict";
/* ===== RYC Command Center — Phase 1 (compute reimplemented from the legacy dashboard,
   verified against the frozen §8a baseline). Reads the SAME data sources; live untouched. ===== */
var CRM = "https://crm.jbkdevelopment.com";
var activeData=null, foundationData=null, arData=null, buildrData=null, portfolioData=null, subsData=null, loadedAt=null, foundationOnly=[];

var NAV = [
  { key:"command",  label:"Command Center", ic:"&#129517;" },
  { key:"portfolio",label:"Portfolio",      ic:"&#128203;" },
  { key:"billing",  label:"Billing & Cash", ic:"&#128181;" },
  { key:"margin",   label:"Margin & Risk",  ic:"&#128201;" },
  { key:"brief",    label:"Executive Brief",ic:"&#128196;" },
  { key:"trust",    label:"Data Trust",     ic:"&#128270;" },
  { key:"ai",       label:"AI Assistant",   ic:"&#128172;" }
];
var currentView = "command";

var CLOSEOUT_STAGES = { "Warranty":1, "Post-Construction":1 };
var GF_MOVE_PTS = 1.0, GF_BURN_PTS = 12, GF_BURN_MINPCT = 20;

/* ---- format helpers ---- */
function fmt(n){ return n==null?"—":"$"+Math.round(n).toLocaleString("en-US"); }
function fmtCompact(n){ if(n==null) return "—"; var a=Math.abs(n),s=n<0?"-":""; if(a>=1e6) return s+"$"+(a/1e6).toFixed(1)+"M"; if(a>=1e3) return s+"$"+Math.round(a/1e3).toLocaleString("en-US")+"K"; return s+"$"+Math.round(a).toLocaleString("en-US"); }
function pct(n){ return n==null?"—":n.toFixed(1)+"%"; }
function fmtDate(s){ if(!s) return "—"; var d=new Date(s); return isNaN(d.getTime())?"—":d.toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"}); }
function ageTxt(ts){ if(!ts) return null; var h=(Date.now()-new Date(ts))/3600000; if(!(h>=0)) return null;
  if(h<1.5) return Math.max(1,Math.round(h*60))+"m ago"; if(h<48) return (h<10?h.toFixed(1):Math.round(h))+"h ago"; return Math.round(h/24)+"d ago"; }
function esc(s){ if(!s) return ""; var d=document.createElement("div"); d.textContent=s; return d.innerHTML; }
function pmName(job){ return (job.foundation && job.foundation.pmName) || (job.pm && job.pm.name) || null; }
function contractedMargin(job){ var cv=job.contractValue, bo=job.budget && job.budget.original; if(!(cv>0 && bo>0)) return null; return bo>=cv?0:((cv-bo)/cv*100); }
function marginToDate(job){ var cv=job.contractValue, dc=(job.costToDate!=null?job.costToDate:(job.budget&&job.budget.direct)); return (cv>0 && dc>0)?((cv-dc)/cv*100):null; }

/* ---- Foundation merge (Procore-revised contract priority; ported from legacy v1.29.0) ---- */
function mergeFoundation(){
  foundationOnly=[];
  if(!activeData || !activeData.jobs) return;
  var fjobs=(foundationData && foundationData.jobs)||{};
  var procoreNums=new Set();
  for(var i=0;i<activeData.jobs.length;i++){
    var j=activeData.jobs[i];
    var num=(j.projectNumber||"").trim(); procoreNums.add(num);
    var f=fjobs[num]; j.flags=[];
    var rev=(j.revisedContract>0)?j.revisedContract:0;
    if(!f){ j.foundation=null; j.costToDate=(j.budget&&j.budget.direct)!=null?j.budget.direct:null; if(rev){ j.procoreContractValue=j.contractValue; j.contractValue=rev; } continue; }
    j.foundation=f;
    if(rev){
      j.procoreContractValue=j.contractValue; j.contractValue=rev;
      var fd=(f.currentContract||0)-rev;
      if(f.currentContract>0 && Math.abs(fd)>50000 && Math.abs(fd)>rev*0.02) j.flags.push({type:"contract",text:"Foundation "+fmtCompact(f.currentContract)});
    } else if(f.currentContract>0){
      j.procoreContractValue=j.contractValue; j.contractValue=f.currentContract;
      var d=j.contractValue-(j.procoreContractValue||0);
      if(j.procoreContractValue && Math.abs(d)>50000 && Math.abs(d)>j.contractValue*0.02) j.flags.push({type:"contract",text:"Procore "+fmtCompact(j.procoreContractValue)});
    }
    j.costToDate=(f.totalCosts!=null)?f.totalCosts:((j.budget&&j.budget.direct)!=null?j.budget.direct:null);
    if(j.costToDate!=null && j.contractValue>0) j.costOverrun=j.costToDate>j.contractValue;
    if(f.jobStatus==="C") j.flags.push({type:"closed",text:"Foundation: closed"});
  }
  foundationOnly=Object.values(fjobs).filter(function(f){ return f.jobStatus==="A" && !procoreNums.has((f.jobNo||"").trim()) && (((f.currentContract||0)>0)||((f.originalContract||0)>0)); });
}

function getActiveJobs(){ return ((activeData&&activeData.jobs)||[]).filter(function(j){ return !CLOSEOUT_STAGES[j.stage]; }); }

function getStoplight(job, live){
  var stage=live?live.stage:null, pctComp=live?live.pctComplete:null, costOverrun=live?live.costOverrun:null;
  var finishDate=live?(live.projectedFinish||live.completionDate):null, verifyStatus=live?live.verifyStatus:null;
  var cMargin=contractedMargin(job), mtd=marginToDate(job);
  var co=live?live.changeOrders:null;
  var coExposure=(co&&co.netValue&&job.contractValue)?Math.abs(co.netValue)/job.contractValue:0;
  var isPrecon=stage==="Pre-Construction"||(!(live&&live.budget)&&(pctComp==null||pctComp===0));
  if(isPrecon) return {color:"gray",reasons:[]};
  var daysOverdue=finishDate?Math.floor((Date.now()-new Date(finishDate))/86400000):0;
  var reasons=[];
  if(costOverrun) reasons.push({level:"red",text:"Cost overrun"});
  if(mtd!=null && mtd<0) reasons.push({level:"red",text:"Margin to date "+mtd.toFixed(1)+"%"});
  if(daysOverdue>30 && !verifyStatus) reasons.push({level:"red",text:Math.abs(daysOverdue)+" days past projected finish"});
  var red=reasons.some(function(r){return r.level==="red";});
  if(!red){
    if(cMargin!=null && cMargin>0 && cMargin<5) reasons.push({level:"amber",text:"Contracted margin "+cMargin.toFixed(1)+"% (below 5%)"});
    if(pctComp!=null && pctComp>=10 && mtd!=null && cMargin!=null && mtd<cMargin) reasons.push({level:"amber",text:"Margin declining "+mtd.toFixed(1)+"% vs "+cMargin.toFixed(1)+"% contracted"});
    if(daysOverdue>=1 && daysOverdue<=30) reasons.push({level:"amber",text:daysOverdue+" days past projected finish"});
    if(coExposure>0.07) reasons.push({level:"amber",text:"CO exposure "+(coExposure*100).toFixed(1)+"% of contract"});
    if(finishDate && !verifyStatus && daysOverdue<=0 && Math.abs(daysOverdue)<=30) reasons.push({level:"amber",text:"Finishing in "+Math.abs(daysOverdue)+" days"});
  }
  var amber=!red && reasons.some(function(r){return r.level==="amber";});
  return {color:red?"red":amber?"amber":"green",reasons:reasons};
}

/* ---- gain/fade (ported; gainFadeFor extracted for the Phase-3a drawer — same math) ---- */
function gainFadeFor(j){
  var f=j.foundation, b=j.budget||{}, pctc=j.pctComplete;
  var pC=j.procoreContractValue!=null?j.procoreContractValue:j.contractValue;
  var curContract=(f&&f.currentContract>0)?f.currentContract:pC;
  var asbidContract=(f&&f.originalContract>0)?f.originalContract:pC;
  var asbidCost=(f&&f.originalCost!=null)?f.originalCost:b.original;
  if(!(curContract>0)||asbidCost==null) return null;
  var costGrowth=(b.revised>0&&b.original>0)?(b.revised-b.original):0;
  var coIncome=(f&&f.originalContract>0)?(curContract-asbidContract):null;
  var projCost=asbidCost+costGrowth;
  var asbid=(asbidContract-asbidCost)/asbidContract*100;
  var curMargin=(curContract-projCost)/curContract*100;
  var gfPts=curMargin-asbid;
  var gfDollars=(coIncome!=null?coIncome:0)-costGrowth;
  var costToDate=f?f.totalCosts:null;
  var burnPct=(costToDate!=null&&projCost>0)?costToDate/projCost*100:null;
  var burnRisk=burnPct!=null&&pctc!=null&&pctc>=GF_BURN_MINPCT&&(burnPct-pctc)>=GF_BURN_PTS;
  return {job:j.projectNumber||"",name:j.name||(f&&f.description)||"",pm:pmName(j)||"(no PM)",pct:pctc,gfPts:gfPts,gfDollars:gfDollars,burnRisk:burnRisk,asbidMargin:asbid,curMargin:curMargin};
}
function gainFadeRows(){
  var rows=[];
  var jobs=getActiveJobs();
  for(var i=0;i<jobs.length;i++){
    var r=gainFadeFor(jobs[i]);
    if(r) rows.push(r);
  }
  return rows;
}

function activeJobSet(){ var fj=(foundationData&&foundationData.jobs)||{}; var s=new Set(); Object.values(fj).forEach(function(j){ if(j.jobStatus==="A") s.add(String(j.jobNo)); }); return s; }
function arRows(cat,scope){ var active=scope?activeJobSet():null; return ((arData&&arData.invoices)||[]).filter(function(v){ if(v.category!==cat) return false; if(!scope) return true; var isA=active.has(String(v.jobNo||"")); return scope==="active"?isA:!isA; }); }
function overdueByJob(scope){ var m={}; arRows("overdue",scope).forEach(function(v){ var k=String(v.jobNo||""); m[k]=(m[k]||0)+(v.openBalance||0); }); return m; }
function activeAccountRows(){
  var fj=(foundationData&&foundationData.jobs)||{}; var odo=overdueByJob("active"); var rows=[];
  Object.values(fj).forEach(function(f){
    if(f.jobStatus!=="A") return;
    var cost=f.totalCosts||0, estCost=f.originalCost||0, invoiced=f.totalInvoiced||0;
    var contract=f.currentContract||f.originalContract||0, oh=f.ohMarkup, pr=f.profitMarkup;
    var deficit=null, exact=false;
    if(cost>0&&oh>0&&pr>0){ deficit=invoiced-cost*oh*pr; exact=true; }
    else if(cost>0&&estCost>0&&(f.originalContract||0)>0){ deficit=invoiced-cost*(f.originalContract/estCost); }
    rows.push({pm:f.pmName||"(no PM)",job:f.jobNo,name:f.description||"",contract:contract,cost:cost,invoiced:invoiced,retainage:f.retainage||0,deficit:deficit,exact:exact,under:(deficit!=null&&deficit<0)?-deficit:0,over:(deficit!=null&&deficit>0)?deficit:0,overdue:odo[String(f.jobNo)]||0});
  });
  return rows;
}

/* ---- Buildr follow-ups ---- */
function buildrFollowUps(){
  var res={items:[],loaded:0,matched:0,flagged:0};
  if(!buildrData||!buildrData.jobs) return res;
  var byNum={}; getActiveJobs().forEach(function(j){ byNum[String(j.projectNumber||"").trim()]=j; });
  var keys=Object.keys(buildrData.jobs); res.loaded=keys.length;
  keys.forEach(function(k){
    var rec=buildrData.jobs[k];
    var num=String((rec&&rec.projectNumber)||k||"").trim();
    var job=byNum[num]; if(!job) return;
    res.matched++;
    if(rec && rec.needsAttention){
      res.flagged++;
      var last=rec.daysSinceLastMeeting;
      res.items.push({job:num,name:job.name||"",pm:pmName(job)||"(no PM)",detail:last==null?"No owner visit logged in Buildr":"Last owner visit "+last+"d ago",open:(rec.openTasks||[]).length});
    }
  });
  return res;
}

// Closeout-aging split (Keith, 2026-07-07): jobs that are cost-complete (>=98%) and >30d past
// projected finish but STILL OPEN in Foundation are in punchlist/closeout — a different leadership
// conversation (retainage tied up, closeout dragging) than financial risk. The REAL closeout test
// is Foundation-side: retainage to zero, all subs paid, job closed. Only jobs whose sole red
// trigger is "past projected finish" move there; a cost-overrun/negative-margin red stays red.
function daysPastFinish(j){ var fin=j.projectedFinish||j.completionDate; return fin?Math.floor((Date.now()-new Date(fin))/86400000):0; }
function isCloseoutAging(j){ return daysPastFinish(j)>30 && j.pctComplete!=null && j.pctComplete>=98 && !!j.foundation; }
function isCloseoutOnly(j){ var sl=getStoplight(j,j);
  return sl.color==="red" && isCloseoutAging(j) &&
    sl.reasons.filter(function(r){return r.level==="red";}).every(function(r){return r.text.indexOf("past projected finish")>-1;});
}

function projectedGrossMargin(){
  var jobs=getActiveJobs(), tC=0, tPC=0;
  jobs.forEach(function(j){ var b=j.budget||{}; var pc=b.revised>0?b.revised:(b.original>0?b.original:0); if(j.contractValue>0&&pc>0){ tC+=j.contractValue; tPC+=pc; } });
  return tC>0?((tC-tPC)/tC*100):null;
}

  var tbody=document.getElementById("ptbody");
  tbody.addEventListener("click",function(e){ var tr=e.target.closest("tr[data-jno]"); if(tr) openDrawer(tr.getAttribute("data-jno"),tr); });
  tbody.addEventListener("keydown",function(e){ if(e.key==="Enter"||e.key===" "){ var tr=e.target.closest("tr[data-jno]"); if(tr){ e.preventDefault(); openDrawer(tr.getAttribute("data-jno"),tr); } } });
  updatePTable();
}

/* ===== Job detail drawer (Phase 3a — existing data only; commitments arrive in 3b) ===== */
var _dwTrigger=null;
function jobByNo(jno){
  var jobs=(activeData&&activeData.jobs)||[];
  for(var i=0;i<jobs.length;i++){ if(String(jobs[i].projectNumber||"").trim()===String(jno).trim()) return jobs[i]; }
  return null;
}
function reconRow(label,pv,fv,fmtFn){
  var f=fmtFn||fmtCompact;
  var pTxt=(pv!=null&&pv!==0)?f(pv):"—", fTxt=(fv!=null&&fv!==0)?f(fv):"—";
  if(pv==null||fv==null||pv===0||fv===0) return "<tr><td>"+label+"</td><td class=\"r\">"+pTxt+"</td><td class=\"r\">"+fTxt+"</td><td class=\"r\">—</td></tr>";
  var d=pv-fv, big=Math.abs(d)>50000&&Math.abs(d)>Math.max(Math.abs(pv),Math.abs(fv))*0.02;
  var dTxt=big?("<span title=\"Diverges — reconcile\">⚑ "+fmtCompact(d)+"</span>"):("✓ "+(Math.abs(d)<1000?"match":fmtCompact(d)));
  return "<tr><td>"+label+"</td><td class=\"r\">"+pTxt+"</td><td class=\"r\">"+fTxt+"</td><td class=\"r "+(big?"dv":"ok")+"\">"+dTxt+"</td></tr>";
}
function drawerHtml(j){
  var f=j.foundation||null, b=j.budget||{}, sl=getStoplight(j,j);
  var status=isCloseoutOnly(j)?"closeout":sl.color;
  var reasons=sl.reasons.map(function(r){return r.text;}).join(" · ");
  var bill=billingByJob()[String(j.projectNumber)]||null;
  var gf=gainFadeFor(j);
  var mtd=marginToDate(j), cm=contractedMargin(j);
  var dpf=daysPastFinish(j);
  var pAge=ageTxt(activeData&&activeData.refreshed), fAge=ageTxt(foundationData&&foundationData.refreshed), aAge=ageTxt(arData&&arData.refreshed);

  /* header */
  var subBits=[esc(j.projectNumber||"")];
  if(j.client) subBits.push(esc(j.client));
  if(pmName(j)) subBits.push("PM "+esc(pmName(j)));
  if(j.superintendent&&j.superintendent.name) subBits.push("Super "+esc(j.superintendent.name));
  var head="<div class=\"dw-head\"><div><h3>"+esc(j.name||"")+"</h3>"
    +"<div class=\"dw-sub\">"+subBits.join(" · ")+(j.address?"<br>"+esc(j.address):"")+"</div>"
    +"<div style=\"margin-top:8px\">"+statusPill(status,reasons)+" <span style=\"color:#67718a;font-size:11.5px;margin-left:6px\">"+esc(j.stage||"")+"</span></div>"
    +(reasons?"<div class=\"dw-reason\">"+esc(reasons)+"</div>":"")
    +"</div><button class=\"dw-close\" onclick=\"closeDrawer()\" aria-label=\"Close\">&times;</button></div>";

  /* financial snapshot */
  function stat(l,v,s){ return "<div class=\"dw-stat\"><div class=\"l\">"+l+"</div><div class=\"v\">"+v+"</div>"+(s?"<div class=\"s\">"+s+"</div>":"")+"</div>"; }
  var atCompletion=(j.contractValue>0&&b.projectedCost>0)?((j.contractValue-b.projectedCost)/j.contractValue*100):null;
  var snap="<div class=\"dw-sec\"><h4>Financial snapshot</h4><div class=\"dw-stats\">"
    +stat("Contract",fmtCompact(j.contractValue),j.revisedContract>0?"Procore revised":"Foundation")
    +stat("Cost to date",j.costToDate!=null?fmtCompact(j.costToDate):"—",f?"Foundation actuals":"Procore direct")
    +stat("Complete",j.pctComplete!=null?Math.round(j.pctComplete)+"%":"—",dpf>0?dpf+"d past finish":"")
    +stat("Margin to date",mtd!=null?mtd.toFixed(1)+"%":"—",cm!=null?"bid "+cm.toFixed(1)+"%":"")
    +stat("Proj. cost (ERP)",b.projectedCost>0?fmtCompact(b.projectedCost):"—",(b.projCostSuspect?"⚑ verify · ":"")+(atCompletion!=null?"margin at compl. "+atCompletion.toFixed(1)+"%":""))
    +stat("Gain / fade",gf?(gf.gfPts>=0?"+":"")+gf.gfPts.toFixed(1)+" pts":"—",gf?fmtCompact(gf.gfDollars)+(gf.burnRisk?" · cost-burn risk":""):"insufficient data")
    +"</div></div>";

  /* Procore vs Foundation reconciliation */
  var recon;
  if(f){
    recon="<div class=\"dw-sec\"><h4>Procore ⇄ Foundation reconciliation</h4>"
      +"<table class=\"dwt\"><tr><th></th><th class=\"r\">Procore</th><th class=\"r\">Foundation</th><th class=\"r\">Δ</th></tr>"
      +reconRow("Contract",j.revisedContract>0?j.revisedContract:null,f.currentContract)
      +reconRow("Original contract",j.procoreContractValue,f.originalContract)
      +reconRow("Cost to date",b.direct,f.totalCosts)
      +reconRow("Original budget / cost",b.original,f.originalCost)
      +reconRow("CO net value",(j.changeOrders&&j.changeOrders.netValue)||null,(f.changeOrders&&f.changeOrders.incomeAdj)||null)
      +"</table><div class=\"dw-note\">⚑ = diverges by more than $50K and 2% — reconcile before quoting either number. Procore cost is budget direct; Foundation cost is posted job cost (all classes, no committed).</div></div>";
  } else {
    recon="<div class=\"dw-sec\"><h4>Procore ⇄ Foundation reconciliation</h4><div class=\"dw-note\">No Foundation match for job number "+esc(j.projectNumber||"—")+" — Procore-only job. Financials here are Procore budget figures, unverified by accounting.</div></div>";
  }

  /* billing & AR */
  var billing="";
  if(f){
    var invs=((arData&&arData.invoices)||[]).filter(function(v){ return String(v.jobNo||"")===String(j.projectNumber) && (v.category==="overdue"||v.category==="open") && (v.openBalance||0)>0; })
      .sort(function(a,c){ return (c.daysOverdue||0)-(a.daysOverdue||0); });
    var invRows=invs.slice(0,12).map(function(v){
      var od=(v.daysOverdue||0)>0;
      return "<tr><td>"+esc(v.payApp?("Pay app "+v.payApp):("Inv "+(v.invoiceNo||"")))+"</td><td>"+fmtDate(v.invoiceDate)+"</td><td>"+fmtDate(v.dueDate)+"</td>"
        +"<td class=\"r\">"+fmtCompact(v.openBalance)+"</td><td class=\"r "+(od?"dv":"")+"\">"+(od?(v.daysOverdue+"d overdue"):"current")+"</td></tr>";
    }).join("");
    billing="<div class=\"dw-sec\"><h4>Billing &amp; AR</h4><div class=\"dw-stats\">"
      +stat("Billed to date",fmtCompact(f.totalInvoiced||0),"")
      +stat("Needs invoicing",bill?fmtCompact(bill.under):"—",bill?(bill.exact?"exact (OH/Profit markups)":"bid-est fallback"):"")
      +stat("Retainage held",fmtCompact(f.retainage||0),"")
      +"</div>"
      +(invs.length?("<table class=\"dwt\" style=\"margin-top:10px\"><tr><th>Invoice</th><th>Invoiced</th><th>Due</th><th class=\"r\">Open balance</th><th class=\"r\">Age</th></tr>"+invRows+"</table>"
        +(invs.length>12?"<div class=\"dw-note\">+ "+(invs.length-12)+" more open invoices.</div>":"")):"<div class=\"dw-note\" style=\"margin-top:8px\">No open or overdue invoices.</div>")
      +"</div>";
  }

  /* cost breakdown (Foundation, by class) */
  var costSec="";
  if(f&&f.costBreakdown){
    var cbKeys=Object.keys(f.costBreakdown).sort(function(a,c){ return f.costBreakdown[c]-f.costBreakdown[a]; });
    var cbTotal=cbKeys.reduce(function(s,k){ return s+(f.costBreakdown[k]||0); },0);
    if(cbTotal>0){
      var cbRows=cbKeys.map(function(k){ var v=f.costBreakdown[k]||0; return "<tr><td>"+esc(k)+"</td><td class=\"r\">"+fmtCompact(v)+"</td><td class=\"r\">"+(v/cbTotal*100).toFixed(0)+"%</td></tr>"; }).join("");
      costSec="<div class=\"dw-sec\"><h4>Cost to date by class (Foundation)</h4><table class=\"dwt\"><tr><th>Class</th><th class=\"r\">Posted</th><th class=\"r\">Share</th></tr>"+cbRows+"</table></div>";
    }
  }

  /* change orders */
  var coSec="";
  var co=j.changeOrders;
  if((co&&co.count)||(f&&f.changeOrders&&f.changeOrders.count)){
    var chips="";
    if(co&&co.byType){ chips=Object.keys(co.byType).map(function(k){ return "<span class=\"dw-chip\">"+esc(k)+" &middot; "+co.byType[k]+"</span>"; }).join(""); }
    coSec="<div class=\"dw-sec\"><h4>Change orders</h4><div class=\"dw-stats\">"
      +stat("Procore COs",co?String(co.count):"—",co?("net "+fmtCompact(co.netValue||0)):"")
      +stat("Foundation CO income",f&&f.changeOrders?fmtCompact(f.changeOrders.incomeAdj||0):"—",f&&f.changeOrders?(f.changeOrders.count+" posted"):"")
      +stat("Foundation CO cost",f&&f.changeOrders?fmtCompact(f.changeOrders.costAdj||0):"—","")
      +"</div>"+(chips?"<div style=\"margin-top:9px\">"+chips+"</div>":"")+"</div>";
  }

  /* field & schedule */
  var field="<div class=\"dw-sec\"><h4>Field &amp; schedule (Procore)</h4><div class=\"dw-stats\">"
    +stat("Start",fmtDate(j.start),"")
    +stat("Projected finish",fmtDate(j.projectedFinish||j.completionDate),dpf>0?("<span style=\"color:#c07f1a\">"+dpf+"d past</span>"):(j.projectedFinish?Math.abs(dpf)+"d out":""))
    +stat("RFIs open",j.rfis?(j.rfis.open+" <span style=\"color:#8b95ab;font-size:12px\">/ "+j.rfis.total+"</span>"):"—","")
    +stat("Submittals open",j.submittals?(j.submittals.open+" <span style=\"color:#8b95ab;font-size:12px\">/ "+j.submittals.total+"</span>"):"—","")
    +stat("Work type",esc((j.workType||"—").replace(/_/g," ")),"")
    +stat("Client type",esc(j.clientType||"—"),"")
    +"</div></div>";

  /* source trail */
  var trail="<div class=\"dw-sec\"><h4>Source trail</h4><table class=\"dwt\">"
    +"<tr><th>Fields</th><th>Source</th><th class=\"r\">Data age</th></tr>"
    +"<tr><td>Contract (revised)</td><td>Procore prime contract</td><td class=\"r\">"+(pAge||"—")+"</td></tr>"
    +"<tr><td>Cost, billed, retainage, PM, CO postings</td><td>Foundation nightly ODBC</td><td class=\"r\">"+(fAge||"—")+"</td></tr>"
    +"<tr><td>Open / overdue invoices</td><td>Foundation AR feed</td><td class=\"r\">"+(aAge||"—")+"</td></tr>"
    +"<tr><td>Schedule, %, RFIs, submittals, CO types</td><td>Procore daily cache</td><td class=\"r\">"+(pAge||"—")+"</td></tr>"
    +"</table><div class=\"dw-note\">Full field-by-field provenance: 📖 Data Sources on the legacy dashboard, or RYC_Dashboard_Data_Dictionary.md. Commitments / buyout arrive in Phase 3b.</div></div>";

  return head+"<div class=\"dw-body\">"+snap+recon+billing+costSec+coSec+field+trail+"</div>";
}
function openDrawer(jno,trigger){
  var j=jobByNo(jno); if(!j) return;
  closeDrawer(true);
  _dwTrigger=trigger||null;
  var wrap=document.createElement("div"); wrap.id="dwrap";
  wrap.innerHTML="<div class=\"dw-overlay\" onclick=\"closeDrawer()\"></div><aside class=\"drawer\" role=\"dialog\" aria-modal=\"true\" aria-label=\"Job detail: "+attrEsc(j.name||jno)+"\">"+drawerHtml(j)+"</aside>";
  document.body.appendChild(wrap);
  document.addEventListener("keydown",dwEsc);
  var cb=wrap.querySelector(".dw-close"); if(cb) cb.focus();
}
function dwEsc(e){ if(e.key==="Escape") closeDrawer(); }
function closeDrawer(silent){
  var w=document.getElementById("dwrap");
  if(!w) return;
  w.remove();
  document.removeEventListener("keydown",dwEsc);
  if(!silent&&_dwTrigger&&document.contains(_dwTrigger)) _dwTrigger.focus();
  _dwTrigger=null;
}

/* ---- gate / nav / boot ---- */
function showApp(){ document.getElementById("gate").style.display="none"; document.getElementById("app").hidden=false; init(); }
function tryGate(){ var v=document.getElementById("gate-input").value.trim(); if(v==="ryc2026"){ sessionStorage.setItem("ryc_cmd_auth","1"); showApp(); } else { document.getElementById("gate-err").textContent="Incorrect access code"; } }
document.getElementById("gate-btn").addEventListener("click",tryGate);
document.getElementById("gate-input").addEventListener("keydown",function(e){ if(e.key==="Enter") tryGate(); });

function bust(u){ return u+(u.indexOf("?")>-1?"&":"?")+"t="+Date.now(); }
function getJSON(u){ return fetch(bust(u)).then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); }).catch(function(){ return null; }); }
function loadData(){
  return Promise.all([
    getJSON("/ryc-dashboard/procore-cache.json"),
    getJSON(CRM+"/api/ryc-foundation"),
    getJSON(CRM+"/api/ryc-ar"),
    getJSON(CRM+"/api/ryc-buildr"),
    getJSON("/ryc-dashboard/ryc-portfolio.json"),
    getJSON("/ryc-dashboard/ryc-subcontractors.json")
  ]).then(function(r){
    activeData=r[0]; foundationData=r[1]; arData=r[2]; buildrData=r[3]; portfolioData=r[4]; subsData=r[5]; loadedAt=new Date();
    mergeFoundation();
  });
}

function renderNav(){
  var el=document.getElementById("nav");
  el.innerHTML=NAV.map(function(n){ var on=n.key===currentView; return "<button type=\"button\" data-key=\""+n.key+"\" class=\""+(on?"active":"")+"\""+(on?" aria-current=\"page\"":"")+"><span class=\"ic\">"+n.ic+"</span>"+n.label+"</button>"; }).join("");
  Array.prototype.forEach.call(el.querySelectorAll("button"),function(a){ a.addEventListener("click",function(){ setView(a.getAttribute("data-key")); }); });
}
function setView(k){ closeDrawer(true); currentView=k; renderNav(); renderView();
  var btn=document.querySelector("#nav button.active"); if(btn) btn.focus(); // restore focus after re-render (a11y)
}
function renderView(){
  var titles={command:"Command Center",portfolio:"Portfolio",billing:"Billing & Cash",margin:"Margin & Risk",brief:"Executive Brief",trust:"Data Trust",ai:"AI Assistant"};
  document.getElementById("view-title").textContent=titles[currentView]||"Command Center";
  document.getElementById("view-ctx").innerHTML="Procore (revised contract) + Foundation · loaded "+(loadedAt?loadedAt.toLocaleString():"…");
  var view=document.getElementById("view");
  // dark showcase for the Command Center; light operator theme for work views (FundView tiering)
  document.querySelector(".content").classList.toggle("light",currentView!=="command");
  if(currentView==="command"){ view.innerHTML=renderCommand(); return; }
  if(currentView==="portfolio"){ renderPortfolio(); return; }
  view.innerHTML="<div class=\"panel\"><h3>"+(titles[currentView]||"")+"</h3><div class=\"sub\">Coming in a later phase. Shell, data plumbing, Command Center, and Portfolio are live.</div></div>";
}
function init(){
  renderNav();
  document.getElementById("view").innerHTML="<div class=\"panel\"><div class=\"sub\">Loading data…</div></div>";
  loadData().then(function(){ renderView(); });
}
if(sessionStorage.getItem("ryc_cmd_auth")==="1"){ showApp(); }
else { setTimeout(function(){ document.getElementById("gate-input").focus(); },100); }
</script>
