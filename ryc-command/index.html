<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>R. Yoder — Command</title>
<link rel="icon" href="/ryc-data/RYC_Shield_Orange.png">
<link rel="stylesheet" href="/ryc-shell/shell.css">
<link rel="stylesheet" href="/ryc-command/command.css?v2.24.0">
<script src="/ryc-shell/shell.js"></script>
</head>
<body>

<div id="gate">
  <div class="card">
    <img src="/ryc-data/RYC_Shield_Orange.png" alt="RYC">
    <h1>R. Yoder</h1>
    <p>Command — operations workspace</p>
    <input id="gate-input" type="password" placeholder="Access code" autocomplete="off">
    <div class="err" id="gate-err"></div>
    <button id="gate-btn">Enter</button>
  </div>
</div>

<div id="app" hidden>
  <!-- Phase C: the rail, workspace switcher and identity area come from the SHARED shell
       (/ryc-shell) — the same component the Estimating Desk mounts. Command keeps its dark
       operations mood BELOW the shell; the navigation grammar is no longer its own. -->
  <div class="ryc-shell">
    <aside class="ryc-side" id="ryc-side"></aside>
    <main class="content ryc-main">
      <div class="topbar">
        <div><h2 id="view-title">Overview</h2><div class="ctx" id="view-ctx">Loading&hellip;</div></div>
        <!-- Integration machinery (Procore/Foundation refresh) lives in Data Trust, not on
             ordinary screens — normal users see business actions, not plumbing (Codex Step 3). -->
      </div>
      <div class="view" id="view"></div>
    </main>
  </div>
</div>


<script src="/ryc-data/data-sources.js"></script>
<script src="/ryc-command/core.js?v2.24.0"></script>
<script src="/ryc-command/views.js?v2.24.0"></script>
<script src="/ryc-command/app.js?v2.24.0"></script>
</body>
</html>
