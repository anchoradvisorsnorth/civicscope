<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RYC Command Center</title>
<link rel="icon" href="/ryc-dashboard/RYC_Shield_Orange.png">
<link rel="stylesheet" href="/ryc-command/command.css?v2.15.0">
</head>
<body>

<div id="gate">
  <div class="card">
    <img src="/ryc-dashboard/RYC_Shield_Orange.png" alt="RYC">
    <h1>Command Center</h1>
    <p>R. Yoder Construction</p>
    <input id="gate-input" type="password" placeholder="Access code" autocomplete="off">
    <div class="err" id="gate-err"></div>
    <button id="gate-btn">Enter</button>
  </div>
</div>

<div id="app" hidden>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand">
        <img src="/ryc-dashboard/RYC_Shield_Orange.png" alt="RYC">
        <div><div class="bt">R. Yoder</div><div class="bs">Command Center</div></div>
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="side-foot">
        <a href="/ryc/estimate">&#128208; Estimating Tools &rarr;</a>
        <a href="/ryc/dashboard">&#11116; Legacy Dashboard</a>
        <div class="ver">v2.17.0-command &middot; WOH col relabel</div>
      </div>
    </aside>
    <main class="content">
      <div class="topbar">
        <div><h2 id="view-title">Command Center</h2><div class="ctx" id="view-ctx">Loading&hellip;</div></div>
        <button class="pfill" id="fdn-refresh-top" onclick="refreshFoundation(this)" title="Re-pull Foundation (accounting) now &mdash; catches posting batches since the ~5am snapshot">&#10227; Refresh Foundation</button>
      </div>
      <div class="view" id="view"></div>
    </main>
  </div>
</div>

<script src="/ryc-dashboard/data-sources.js"></script>
<script src="/ryc-command/core.js?v2.17.0"></script>
<script src="/ryc-command/views.js?v2.17.0"></script>
<script src="/ryc-command/app.js?v2.17.0"></script>
</body>
</html>
